function seedTestData(p){const now=Date.now();const h1=alloc(p,'tagHead'),h2=alloc(p,'tagHead');p.tagHeads[h1]={id:h1,name:'장르'};p.tagHeads[h2]={id:h2,name:'상태'};p.tagHeadOrder.push(h1,h2);const mkTag=(name,headId)=>{const id=alloc(p,'tag');p.tags[id]={id,name,headId};return id};const sf=mkTag('SF',h1),fantasy=mkTag('판타지',h1),fav=mkTag('즐겨찾기',h2),todo=mkTag('나중에 보기',h2);const root=alloc(p,'category'),video=alloc(p,'category'),doc=alloc(p,'category');p.categories[root]={id:root,name:'테스트 자료'};p.categories[video]={id:video,name:'영상',parentId:root};p.categories[doc]={id:doc,name:'문서',parentId:root};const bTitle=pageInputByName(p,'bookmark','제목'),bUrl=pageInputByName(p,'bookmark','URL'),bNote=pageInputByName(p,'bookmark','메모'),bTags=pageInputByName(p,'bookmark','태그'),bCats=pageInputByName(p,'bookmark','카테고리'),bRel=pageInputByName(p,'bookmark','관련 Record');const rName=pageInputByName(p,'record','이름'),rDesc=pageInputByName(p,'record','설명'),rTags=pageInputByName(p,'record','태그');const r1=alloc(p,'record'),r2=alloc(p,'record');p.records[r1]={id:r1,values:{[rName]:'Alice',[rDesc]:'테스트 Record A',[rTags]:[sf]},createdAt:now,updatedAt:now};p.records[r2]={id:r2,values:{[rName]:'Bob',[rDesc]:'테스트 Record B',[rTags]:[fantasy]},createdAt:now+1,updatedAt:now+1};const f=alloc(p,'folder');p.folders[f]={id:f,name:'샘플 Folder'};const addB=(title,url,note,tags,cats,rels,folderId)=>{const id=alloc(p,'bookmark'),values={[bTitle]:title,[bUrl]:url,[bNote]:note,[bTags]:tags,[bCats]:cats,[bRel]:rels};p.bookmarks[id]={id,values,...(folderId?{folderId}:{}),createdAt:now,updatedAt:now};return id};addB('테스트 북마크 A','https://example.com/a','Folder/Tag/Record 관계 테스트',[sf,fav],[video],[r1],f);addB('테스트 북마크 B','https://example.com/b','복수 Tag와 Category 테스트',[fantasy,todo],[doc],[r2],f);addB('테스트 북마크 C','https://example.com/c','Unfiled 테스트',[sf,fantasy],[root],[r1,r2],null);return p}

function validate(d){const issues=[];if(d?.meta?.format!=='tagmark'||d?.meta?.formatVersion!==1)issues.push('v4 Format 1 파일이 아닙니다.');for(const pid of d?.main?.pageOrder||[])if(!d.pages?.[pid])issues.push('없는 Page가 pageOrder에 있습니다: '+pid);for(const [pid,p] of Object.entries(d?.pages||{})){if(p.id!==pid)issues.push(pid+' Page ID 불일치');for(const [bid,b] of Object.entries(p.bookmarks||{}))if(b.folderId&&!p.folders[b.folderId])issues.push(`${pid}/${bid}: 없는 Folder 참조`);for(const [cid,c] of Object.entries(p.categories||{})){let seen=new Set([cid]),cur=c.parentId;while(cur){if(seen.has(cur)){issues.push(`${pid}/${cid}: Category cycle`);break}seen.add(cur);cur=p.categories[cur]?.parentId}}}return issues}

function tabView(t){const a=filtered(t);let add=t.type==='bookmark'?'＋ Bookmark':t.type==='record'?'＋ Record':t.type==='tag'?'＋ Tag':'＋ Category';return `<div class="toolbar"><input placeholder="검색" value="${E(rt.search)}" oninput="rt.search=this.value;body()"><button class="primary" onclick="addEntity()">${add}</button>${t.type==='bookmark'?'<button onclick="folderModal()">Folder</button>':''}${t.type==='record'?'<button onclick="groupModal()">Auto Folder</button>':''}<button onclick="toggleSelect()">${rt.select?'선택 종료':'선택'}</button><button onclick="schemaModal()" ${!['bookmark','record'].includes(t.type)?'disabled':''}>Field / Input</button><button onclick="tabSettings()">Tab Settings</button></div>${rt.select?`<div class="selectbar"><b>${rt.selected.size}개 선택</b><button onclick="selectAll()">전체 선택</button><button class="danger" onclick="bulkDelete()">삭제</button></div>`:''}${renderEntities(t,a)}`}
function renderEntities(t,a){if(!a.length)return '<div class="empty">표시할 항목이 없습니다.</div>';if(t.type==='bookmark'){const p=page(),groups=new Map();for(const e of a){const k=e.folderId||'';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)}let out='';for(const [fid,items] of groups){const name=fid?p.folders[fid]?.name||'Folder':'Unfiled';out+=`<div class="folder"><div class="folderhead"><b>${E(name)}</b><span class="muted">${items.length}개</span></div><div class="folderbody ${curt().layout.mode==='list'?'list':'grid'}">${items.map(e=>card(t,e)).join('')}</div></div>`}return out}if(t.type==='record'&&t.grouping?.mode==='input'&&t.grouping.inputId){const groups=new Map();for(const e of a){let v=e.values?.[t.grouping.inputId];let vals=Array.isArray(v)?v:[v??''];for(const k of vals){if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)}}return [...groups].map(([k,v])=>`<div class="folder"><b>${E(displayValue(page().inputs[t.grouping.inputId],k)||'값 없음')}</b><div class="folderbody grid">${v.map(e=>card(t,e)).join('')}</div></div>`).join('')}return `<div class="${t.layout.mode==='list'?'list':'grid'}">${a.map(e=>card(t,e)).join('')}</div>`}
function displayValue(inp,v){if(v==null)return '';const p=page();if(inp?.type==='relation'){const m={tag:p.tags,record:p.records,bookmark:p.bookmarks,category:p.categories,folder:p.folders}[inp.target]||{};if(Array.isArray(v))return v.map(x=>m[x]?.name||m[x]?.values?.[Object.keys(m[x]?.values||{})[0]]||x).join(', ');return m[v]?.name||v}return Array.isArray(v)?v.join(', '):String(v)}
function card(t,e){if(t.type==='tag'||t.type==='category')return `<div class="card ${rt.selected.has(e.id)?'sel':''}" onclick="${rt.select?`pick('${e.id}')`:`editSimple('${e.id}')`}"><h3>${E(e.name)}</h3><div class="muted">${E(e.id)}</div></div>`;const p=page(),s=p.schemas[t.schemaId];let fs='';for(const gid of s.fieldOrder){const f=s.fields[gid];for(const qid of f.placementOrder){const pl=f.placements[qid],inp=p.inputs[pl.inputId],v=e.values?.[pl.inputId];if(v===undefined)continue;fs+=`<div class="field"><div class="fname">${E(pl.alias||f.name||inp.name)}</div>${E(displayValue(inp,v))}</div>`}}return `<div class="card ${rt.selected.has(e.id)?'sel':''}" onclick="${rt.select?`pick('${e.id}')`:`editEntity('${e.id}')`}"><h3>${E(titleOf(t,e))}</h3>${fs}<div class="muted">${E(e.id)}</div></div>`}
function toggleSelect(){rt.select=!rt.select;rt.selected.clear();body()}function pick(id){rt.selected.has(id)?rt.selected.delete(id):rt.selected.add(id);body()}function selectAll(){filtered(curt()).forEach(e=>rt.selected.add(e.id));body()}
function modal(title,html,foot=''){document.body.insertAdjacentHTML('beforeend',`<div class="modalback" id="modal"><div class="modal"><h2>${title}</h2>${html}<div class="foot">${foot||'<button onclick="closeModal()">닫기</button>'}</div></div></div>`)}function closeModal(){document.getElementById('modal')?.remove()}function toast(s){let d=document.createElement('div');d.textContent=s;Object.assign(d.style,{position:'fixed',bottom:'20px',left:'50%',transform:'translateX(-50%)',background:'#111827',color:'#fff',padding:'10px 14px',borderRadius:'9px',zIndex:999});document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function addEntity(){const t=curt();if(t.type==='tag'||t.type==='category')return editSimple(null);editEntity(null)}
function editEntity(id){const t=curt(),p=page(),col=t.type==='bookmark'?p.bookmarks:p.records,e=id?col[id]:{id:null,values:{}};const s=p.schemas[t.schemaId];let html='<div class="form">';for(const gid of s.fieldOrder){const f=s.fields[gid];for(const qid of f.placementOrder){const pl=f.placements[qid],inp=p.inputs[pl.inputId],v=e.values?.[inp.id];html+=editor(inp,v)}}if(t.type==='bookmark')html+=`<label>Folder<select id="folderId"><option value="">Unfiled</option>${Object.values(p.folders).map(f=>`<option value="${f.id}" ${e.folderId===f.id?'selected':''}>${E(f.name)}</option>`).join('')}</select></label>`;html+='</div>';modal(id?'편집':'새 '+(t.type==='bookmark'?'Bookmark':'Record'),html,`<button onclick="closeModal()">취소</button>${id?`<button class="danger" onclick="deleteOne('${id}')">삭제</button>`:''}<button class="primary" onclick="saveEntity('${id||''}')">저장</button>`)}
function editor(inp,v){if(inp.type==='relation'){const p=page(),m={tag:p.tags,record:p.records,bookmark:p.bookmarks,category:p.categories,folder:p.folders}[inp.target]||{};const vals=Array.isArray(v)?v:(v?[v]:[]);return `<label>${E(inp.name)}<select data-i="${inp.id}" ${inp.multiple?'multiple':''}>${Object.values(m).map(x=>`<option value="${x.id}" ${vals.includes(x.id)?'selected':''}>${E(x.name||x.id)}</option>`).join('')}</select></label>`}return `<label>${E(inp.name)}${inp.type==='longtext'?`<textarea data-i="${inp.id}">${E(v||'')}</textarea>`:`<input data-i="${inp.id}" type="${inp.type==='number'?'number':inp.type==='date'?'date':inp.type==='datetime'?'datetime-local':'text'}" value="${E(v??'')}">`}</label>`}
function saveEntity(id){const t=curt(),p=page(),col=t.type==='bookmark'?p.bookmarks:p.records;tx(id?'Entity 편집':'Entity 생성',()=>{const e=id?col[id]:{id:alloc(p,t.type),values:{},createdAt:Date.now()};for(const el of document.querySelectorAll('[data-i]')){const inp=p.inputs[el.dataset.i];let v;if(el.tagName==='SELECT')v=inp.multiple?[...el.selectedOptions].map(o=>o.value):el.value;else v=el.value;if(inp.type==='number'&&v!=='')v=Number(v);if(v===''||(Array.isArray(v)&&!v.length))delete e.values[inp.id];else e.values[inp.id]=v}if(t.type==='bookmark'){const f=document.getElementById('folderId').value;if(f)e.folderId=f;else delete e.folderId}e.updatedAt=Date.now();if(!id)col[e.id]=e});closeModal()}
function deleteOne(id){const t=curt(),p=page();tx('Entity 삭제',()=>{delete (t.type==='bookmark'?p.bookmarks:p.records)[id];for(const x of [...Object.values(p.bookmarks),...Object.values(p.records)])for(const [iid,v] of Object.entries(x.values||{})){const inp=p.inputs[iid];if(inp?.type==='relation'&&inp.target===t.type){if(Array.isArray(v)){x.values[iid]=v.filter(z=>z!==id);if(!x.values[iid].length)delete x.values[iid]}else if(v===id)delete x.values[iid]}}});closeModal()}
function bulkDelete(){const ids=[...rt.selected];if(!ids.length)return;modal('선택 항목 삭제',`<div class="notice">${ids.length}개 항목을 삭제합니다.</div>`,`<button onclick="closeModal()">취소</button><button class="danger" onclick="confirmBulkDelete()">삭제</button>`)}function confirmBulkDelete(){const t=curt(),p=page();tx('Bulk 삭제',()=>{const col=t.type==='bookmark'?p.bookmarks:t.type==='record'?p.records:t.type==='tag'?p.tags:p.categories;for(const id of rt.selected)delete col[id]});rt.selected.clear();closeModal()}
function editSimple(id){const t=curt(),p=page(),col=t.type==='tag'?p.tags:p.categories,x=id?col[id]:null;modal(id?'편집':'새 '+(t.type==='tag'?'Tag':'Category'),`<div class="form"><label>이름<input id="simpleName" value="${E(x?.name||'')}"></label>${t.type==='category'?`<label>상위 Category<select id="parent"><option value="">없음</option>${Object.values(p.categories).filter(c=>c.id!==id).map(c=>`<option value="${c.id}" ${x?.parentId===c.id?'selected':''}>${E(c.name)}</option>`).join('')}</select></label>`:''}</div>`,`<button onclick="closeModal()">취소</button>${id&&t.type==='category'?`<button onclick="quickChildCategory('${id}')">하위＋</button>`:''}${id?`<button class="danger" onclick="deleteSimple('${id}')">삭제</button>`:''}<button class="primary" onclick="saveSimple('${id||''}')">저장</button>`)}
function saveSimple(id){const t=curt(),p=page(),col=t.type==='tag'?p.tags:p.categories,name=document.getElementById('simpleName').value.trim();if(!name)return toast('이름을 입력하세요.');tx('분류 정보 저장',()=>{const x=id?col[id]:{id:alloc(p,t.type==='tag'?'tag':'category')};x.name=name;if(t.type==='category'){const par=document.getElementById('parent').value;if(par)x.parentId=par;else delete x.parentId}col[x.id]=x});closeModal()}function deleteSimple(id){const t=curt(),p=page();tx('분류 정보 삭제',()=>{delete (t.type==='tag'?p.tags:p.categories)[id]});closeModal()}
function folderModal(){const p=page();modal('Folder 관리',`<div class="form"><div class="row"><input id="newFolder" placeholder="새 Folder 이름"><button onclick="createFolder()">생성</button></div>${Object.values(p.folders).map(f=>`<div class="row"><b>${E(f.name)}</b><span class="muted">${f.id}</span><button class="danger" onclick="delFolder('${f.id}')">삭제</button></div>`).join('')}</div>`)}function createFolder(assignSelected=false){const n=document.getElementById('newFolder').value.trim();if(!n)return;let fid;tx('Folder 생성',()=>{const p=page();fid=alloc(p,'folder');p.folders[fid]={id:fid,name:n};if(assignSelected)for(const id of rt.selected){const b=p.bookmarks[id];if(b)b.folderId=fid}});if(assignSelected)rt.selected.clear();closeModal()}function delFolder(id){tx('Folder 삭제',()=>{const p=page();delete p.folders[id];for(const b of Object.values(p.bookmarks))if(b.folderId===id)delete b.folderId});closeModal()}
function groupModal(){const p=page(),t=curt(),s=p.schemas[t.schemaId],ids=[...new Set(s.fieldOrder.flatMap(g=>s.fields[g].placementOrder.map(q=>s.fields[g].placements[q].inputId)))];modal('Auto Folder',`<div class="form"><label>Group by<select id="groupI"><option value="">사용 안 함</option>${ids.map(i=>`<option value="${i}" ${t.grouping?.inputId===i?'selected':''}>${E(p.inputs[i].name)}</option>`).join('')}</select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveGroup()">저장</button>`)}function saveGroup(){const i=document.getElementById('groupI').value;tx('Grouping 변경',()=>{curt().grouping=i?{mode:'input',inputId:i}:{mode:'none'}});closeModal()}
function schemaModal(){const p=page(),t=curt(),s=p.schemas[t.schemaId];modal('Field / Input',`<div class="notice">v4에서는 Input이 실제 값을 저장하고 Field는 표시 영역입니다. Field 삭제는 실제 값을 삭제하지 않습니다.</div><div class="form" style="margin-top:10px">${s.fieldOrder.map(g=>{const f=s.fields[g],q=f.placements[f.placementOrder[0]],i=p.inputs[q.inputId];return `<div class="row"><input data-g="${g}" value="${E(f.name)}"><span>${E(i.name)} · ${E(i.type)}</span><button class="danger" onclick="removeField('${g}')">Field 삭제</button></div>`}).join('')}<button onclick="addFieldUI()">＋ 새 Input + Field</button></div>`,`<button onclick="closeModal()">닫기</button><button class="primary" onclick="saveFieldNames()">이름 저장</button>`)}function saveFieldNames(){tx('Field 이름 변경',()=>{for(const el of document.querySelectorAll('[data-g]'))page().schemas[curt().schemaId].fields[el.dataset.g].name=el.value.trim()||'Field'});closeModal()}function removeField(g){tx('Field 삭제',()=>{const s=page().schemas[curt().schemaId];delete s.fields[g];s.fieldOrder=s.fieldOrder.filter(x=>x!==g)});closeModal()}function addFieldUI(){closeModal();modal('새 Input + Field',`<div class="form"><label>Input 이름<input id="inName"></label><label>종류<select id="inType"><option value="text">Text</option><option value="longtext">Long text</option><option value="number">Number</option><option value="url">URL</option><option value="date">Date</option></select></label><label>Field 이름<input id="fieldName"></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="createInputField()">생성</button>`)}function createInputField(){const p=page(),n=document.getElementById('inName').value.trim()||'Input',fn=document.getElementById('fieldName').value.trim()||n,type=document.getElementById('inType').value;tx('Input/Field 생성',()=>{const iid=input(p,n,type),s=p.schemas[curt().schemaId],gid=alloc(p,'field'),qid=alloc(p,'placement');s.fieldOrder.push(gid);s.fields[gid]={id:gid,name:fn,placementOrder:[qid],placements:{[qid]:{id:qid,inputId:iid}}}});closeModal()}
function tabSettings(){const t=curt();modal('Tab Settings',`<div class="form"><label>이름<input id="tabName" value="${E(t.name)}"></label><label>Layout<select id="layout"><option value="grid" ${t.layout.mode==='grid'?'selected':''}>Grid</option><option value="list" ${t.layout.mode==='list'?'selected':''}>List</option></select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveTabSettings()">저장</button>`)}function saveTabSettings(){tx('Tab 설정',()=>{curt().name=document.getElementById('tabName').value.trim()||curt().name;curt().layout.mode=document.getElementById('layout').value});closeModal()}
function pageSettings(){const p=page();modal('Page Settings',`<div class="form"><label>이름<input id="pname" value="${E(p.name)}"></label><label>설명<textarea id="pdesc">${E(p.description)}</textarea></label><div class="notice">Tab 생성은 Page Settings에서 관리합니다.</div><label>새 Tab 종류<select id="newTabType"><option value="bookmark">Bookmark</option><option value="record">Record</option><option value="tag">Tag</option><option value="category">Category</option></select></label><button onclick="createTab()">＋ Tab 생성</button><button onclick="duplicatePage()">Page 복제</button></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="savePageSettings()">저장</button>`)}function savePageSettings(){tx('Page 설정',()=>{page().name=document.getElementById('pname').value.trim()||page().name;page().description=document.getElementById('pdesc').value});closeModal()}function createTab(){const type=document.getElementById('newTabType').value,p=page();tx('Tab 생성',()=>{let sid=null;if(type==='bookmark'||type==='record'){const base=Object.values(p.schemas).find(s=>s.entityType===type);sid=cloneSchema(p,base)}tab(p,type==='record'?'Record':type==='bookmark'?'북마크':type==='tag'?'태그':'카테고리',type,sid)});closeModal()}function cloneSchema(p,src){const sid=alloc(p,'schema'),s={id:sid,entityType:src.entityType,fieldOrder:[],fields:{},inputDisplay:C(src.inputDisplay||{})};for(const og of src.fieldOrder){const of=src.fields[og],ng=alloc(p,'field'),nf={id:ng,name:of.name,placementOrder:[],placements:{}};for(const oq of of.placementOrder){const op=of.placements[oq],nq=alloc(p,'placement');nf.placementOrder.push(nq);nf.placements[nq]={...C(op),id:nq}}s.fieldOrder.push(ng);s.fields[ng]=nf}p.schemas[sid]=s;return sid}
function newPage(){modal('새 Page','<div class="form"><label>이름<input id="npname" value="새 Page"></label></div>','<button onclick="closeModal()">취소</button><button class="primary" onclick="createPageNow()">생성</button>')}function createPageNow(){tx('Page 생성',()=>{const p=makePage(document.getElementById('npname').value.trim()||'새 Page');p.id=alloc(db,'page');db.pages[p.id]=p;db.main.pageOrder.push(p.id);rt.pageId=p.id;rt.tabId=p.tabOrder[0]});closeModal()}function duplicatePage(){const old=page();tx('Page 복제',()=>{const n=C(old),id=alloc(db,'page');n.id=id;n.name=old.name+' Copy';db.pages[id]=n;db.main.pageOrder.push(id);rt.pageId=id;rt.tabId=n.tabOrder[0]});closeModal()}
function systemModal(){modal('DB 관리',`<div class="form"><button onclick="exportDB()">Export</button><button onclick="importDB()">Import / 전체 교체</button><button onclick="dbCheck()">DB Check</button><button onclick="makeBackup()">Backup 다운로드</button><div class="notice">Import는 v4 Format 1만 지원합니다. v1/v2/v3 자동 변환은 포함하지 않습니다.</div></div>`)}function download(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportDB(){download(`tagmark-v4-${Date.now()}.json`,db)}function makeBackup(){download(`tagmark-backup-${Date.now()}.json`,db)}function dbCheck(){const x=validate(db);modal('DB Check',x.length?`<div class="notice">${x.map(E).join('<br>')}</div>`:'<div class="notice">검사 완료: 발견된 구조 오류가 없습니다.</div>')}
function importDB(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const x=JSON.parse(await i.files[0].text()),issues=validate(x);if(issues.length)throw Error(issues[0]);download(`tagmark-emergency-${Date.now()}.json`,db);db=x;rt.pageId=db.main.pageOrder[0]||null;rt.tabId=rt.pageId?db.pages[rt.pageId].tabOrder[0]:null;rt.undo=[];rt.redo=[];await persist();closeModal();render();toast('Import 완료')}catch(e){toast('Import 실패: '+e.message)}};i.click()}

function moveIn(arr,id,dir){const i=arr.indexOf(id),j=i+dir;if(i<0||j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]]}
function schemaInputs(t=curt()){const p=page(),s=p.schemas[t?.schemaId];if(!s)return[];return [...new Set(s.fieldOrder.flatMap(g=>(s.fields[g]?.placementOrder||[]).map(q=>s.fields[g].placements[q]?.inputId).filter(Boolean)))]}
function entityNameById(target,id){const p=page(),m={tag:p.tags,record:p.records,bookmark:p.bookmarks,category:p.categories,folder:p.folders}[target]||{},x=m[id];if(!x)return id;if(x.name)return x.name;const tab=Object.values(p.tabs).find(t=>t.type===target);return tab?titleOf(tab,x):id}
function conditionMatch(e,c){const p=page(),inp=p.inputs[c.inputId],raw=e.values?.[c.inputId];if(c.operator==='empty')return raw===undefined||raw===''||(Array.isArray(raw)&&!raw.length);if(c.operator==='notEmpty')return !conditionMatch(e,{...c,operator:'empty'});if(raw===undefined)return false;const vals=Array.isArray(raw)?raw:[raw],want=c.value;switch(c.operator){case'equals':return vals.some(v=>String(v)===String(want));case'notEquals':return vals.every(v=>String(v)!==String(want));case'contains':return inp?.type==='relation'?vals.includes(want):String(raw).toLowerCase().includes(String(want).toLowerCase());case'excludes':return !vals.includes(want);case'gt':return Number(raw)>Number(want);case'gte':return Number(raw)>=Number(want);case'lt':return Number(raw)<Number(want);case'lte':return Number(raw)<=Number(want);default:return true}}
function filterMatch(e,node){if(!node||!node.items?.length)return true;const rs=node.items.map(x=>x.op?filterMatch(e,x):conditionMatch(e,x));return node.op==='or'?rs.some(Boolean):rs.every(Boolean)}
function filtered(t){let a=entities(t).filter(e=>filterMatch(e,t.filter));const q=rt.search.trim().toLowerCase();if(q)a=a.filter(e=>{if(String(titleOf(t,e)).toLowerCase().includes(q))return true;if(t.type==='tag'||t.type==='category')return String(e.name||'').toLowerCase().includes(q);return Object.entries(e.values||{}).some(([iid,v])=>{const inp=page().inputs[iid];return String(displayValue(inp,v)).toLowerCase().includes(q)})});const sorts=t.sort||[];a.sort((A,B)=>{for(const so of sorts){const av=A.values?.[so.inputId],bv=B.values?.[so.inputId],d=String(displayValue(page().inputs[so.inputId],av)).localeCompare(String(displayValue(page().inputs[so.inputId],bv),undefined,{numeric:true}));if(d)return so.direction==='desc'?-d:d}const d=String(titleOf(t,A)).localeCompare(String(titleOf(t,B),undefined,{numeric:true}));return t.titleSortDirection==='desc'?-d:d});return a}
function tabView(t){const a=filtered(t),add=t.type==='bookmark'?'＋ Bookmark':t.type==='record'?'＋ Record':t.type==='tag'?'＋ Tag':'＋ Category';const fcount=t.filter?.items?.length||0,dir=t.sort?.[0]?.direction||t.titleSortDirection||'asc';return `<div class="toolbar"><input placeholder="검색" value="${E(rt.search)}" oninput="rt.search=this.value;body()"><button class="primary" onclick="addEntity()">${add}</button>${t.type==='bookmark'?'<button onclick="folderModal()">Folder</button>':''}${t.type==='record'?'<button onclick="groupModal()">Auto Folder</button>':''}${t.type==='tag'?'<button onclick="tagHeadModal()">Tag Head</button>':''}<button onclick="filterModal()">Filter${fcount?` (${fcount})`:''}</button><button onclick="sortModal()">Sort</button><button onclick="toggleSortDirQuick()">${dir==='desc'?'↓ Z→A':'↑ A→Z'}</button><button onclick="toggleLayoutQuick()">${t.layout.mode==='list'?'☷ List':'▦ Grid'}</button><button onclick="toggleSelect()">${rt.select?'선택 종료':'선택'}</button><button onclick="schemaModal()" ${!['bookmark','record'].includes(t.type)?'disabled':''}>Field / Input</button><button onclick="tabSettings()">Tab Settings</button></div>${rt.select?`<div class="selectbar"><b>${rt.selected.size}개 선택</b><button onclick="selectAll()">전체 선택</button><button onclick="clearSelection()">선택 해제</button>${['bookmark','record'].includes(t.type)?'<button onclick="bulkRelationQuick(\'tag\')">태그 추가</button><button onclick="bulkRelationQuick(\'category\')">카테고리 추가</button><button onclick="bulkEditModal()">일괄 편집</button>':''}${t.type==='bookmark'?'<button onclick="folderModal()">Folder 이동</button><button onclick="pasteRecordClipboard()">등장인물 붙여넣기</button>':''}<button class="danger" onclick="bulkDelete()">삭제</button></div>`:''}${renderEntities(t,a)}`}
function toggleLayoutQuick(){tx('Tab Layout 변경',()=>{const t=curt();t.layout=t.layout||{mode:'grid'};t.layout.mode=t.layout.mode==='list'?'grid':'list'})}function toggleSortDirQuick(){tx('Sort 방향 변경',()=>{const t=curt();if(t.sort?.length)t.sort[0].direction=t.sort[0].direction==='desc'?'asc':'desc';else t.titleSortDirection=t.titleSortDirection==='desc'?'asc':'desc'})}
function categoryTree(parent=null,depth=0){const p=page(),kids=Object.values(p.categories).filter(c=>(c.parentId||null)===parent).sort((a,b)=>a.name.localeCompare(b.name));return kids.map(c=>`<div class="catrow" style="padding-left:${depth*16}px"><span>${depth?'↳ ':''}<b>${E(c.name)}</b> <span class="muted">${c.id}</span></span><button class="mini" onclick="editSimple('${c.id}')">편집</button></div>${categoryTree(c.id,depth+1)}`).join('')}
function renderEntities(t,a){if(t.type==='category')return a.length?`<div class="card">${categoryTree()}</div>`:'<div class="empty">표시할 Category가 없습니다.</div>';if(t.type==='tag'){const p=page(),heads=[...p.tagHeadOrder.filter(id=>p.tagHeads[id]),...Object.keys(p.tagHeads).filter(id=>!p.tagHeadOrder.includes(id))];const loose=a.filter(x=>!x.headId);return `${heads.map(hid=>{const h=p.tagHeads[hid],ts=a.filter(x=>x.headId===hid);return `<div class="headbox"><div class="folderhead"><b>${E(h.name)}</b><span class="muted">${ts.length}개</span></div><div class="chips">${ts.map(x=>`<button class="chip" onclick="editSimple('${x.id}')">${E(x.name)}</button>`).join('')||'<span class="muted">Tag 없음</span>'}</div></div>`}).join('')}${loose.length?`<div class="headbox"><b>Head 없음</b><div class="chips">${loose.map(x=>`<button class="chip" onclick="editSimple('${x.id}')">${E(x.name)}</button>`).join('')}</div></div>`:''}`}
if(!a.length)return '<div class="empty">표시할 항목이 없습니다.</div>';if(t.type==='bookmark'){const p=page(),groups=new Map();for(const e of a){const k=e.folderId||'';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)}let out='';for(const [fid,items] of groups){const name=fid?p.folders[fid]?.name||'Folder':'Unfiled';out+=`<div class="folder"><div class="folderhead"><b>${E(name)}</b><span class="muted">${items.length}개</span></div><div class="folderbody ${t.layout.mode==='list'?'list':'grid'}">${items.map(e=>card(t,e)).join('')}</div></div>`}return out}if(t.type==='record'&&t.grouping?.mode==='input'&&t.grouping.inputId){const groups=new Map();for(const e of a){let v=e.values?.[t.grouping.inputId],vals=Array.isArray(v)?v:[v??''];for(const k of vals){if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)}}return [...groups].map(([k,v])=>`<div class="folder"><b>${E(displayValue(page().inputs[t.grouping.inputId],k)||'값 없음')}</b><div class="folderbody ${t.layout.mode==='list'?'list':'grid'}">${v.map(e=>card(t,e)).join('')}</div></div>`).join('')}return `<div class="${t.layout.mode==='list'?'list':'grid'}">${a.map(e=>card(t,e)).join('')}</div>`}
function unassignedValues(t,e){const p=page(),s=p.schemas[t.schemaId],used=new Set(s.fieldOrder.flatMap(g=>(s.fields[g]?.placementOrder||[]).map(q=>s.fields[g].placements[q]?.inputId)));return Object.entries(e.values||{}).filter(([iid])=>!used.has(iid)&&p.inputs[iid])}
function card(t,e){if(t.type==='tag'||t.type==='category')return `<div class="card ${rt.selected.has(e.id)?'sel':''}" onclick="${rt.select?`pick('${e.id}')`:`editSimple('${e.id}')`}"><h3>${E(e.name)}</h3><div class="muted">${E(e.id)}</div></div>`;const p=page(),s=p.schemas[t.schemaId];let fs='';for(const gid of s.fieldOrder){const f=s.fields[gid];for(const qid of f.placementOrder){const pl=f.placements[qid],inp=p.inputs[pl.inputId],v=e.values?.[pl.inputId];if(v===undefined)continue;fs+=`<div class="field"><div class="fname">${E(pl.alias||f.name||inp.name)}</div>${E(displayValue(inp,v))}</div>`}}const ua=unassignedValues(t,e);if(ua.length)fs+=`<details class="unassigned"><summary>미지정 정보 (${ua.length})</summary>${ua.map(([iid,v])=>`<div class="field"><div class="fname">${E(p.inputs[iid].name)}</div>${E(displayValue(p.inputs[iid],v))}</div>`).join('')}</details>`;return `<div class="card ${rt.selected.has(e.id)?'sel':''}" onclick="${rt.select?`pick('${e.id}')`:`editEntity('${e.id}')`}"><h3>${E(titleOf(t,e))}</h3>${fs}<div class="muted">${E(e.id)}</div></div>`}
function filterModal(){const p=page(),t=curt();if(!['bookmark','record'].includes(t.type))return modal('Filter','<div class="notice">Tag/Category 전용 고급 필터 UI는 다음 세부 단계에서 확장됩니다. 현재 이름 검색을 사용할 수 있습니다.</div>');const ids=Object.keys(p.inputs);const rows=(t.filter?.items||[]).filter(x=>!x.op);modal('Filter',`<div class="notice">현재는 AND 조건을 직접 구성합니다. 내부 구조는 AND/OR 확장이 가능한 AST입니다.</div><div id="filterRows" class="form">${rows.map((r,i)=>filterRow(r,i,ids)).join('')}</div><button onclick="addFilterRow()">＋ 조건</button>`,`<button onclick="clearFilter()">초기화</button><button onclick="closeModal()">취소</button><button class="primary" onclick="saveFilter()">저장</button>`)}
function filterRow(r={},i=Date.now(),ids=Object.keys(page().inputs)){return `<div class="row" data-filter-row><select data-f-input>${ids.map(id=>`<option value="${id}" ${r.inputId===id?'selected':''}>${E(page().inputs[id].name)}</option>`).join('')}</select><select data-f-op><option value="contains" ${r.operator==='contains'?'selected':''}>포함</option><option value="equals" ${r.operator==='equals'?'selected':''}>같음</option><option value="excludes" ${r.operator==='excludes'?'selected':''}>제외</option><option value="empty" ${r.operator==='empty'?'selected':''}>값 없음</option><option value="notEmpty" ${r.operator==='notEmpty'?'selected':''}>값 있음</option><option value="gte" ${r.operator==='gte'?'selected':''}>≥</option><option value="lte" ${r.operator==='lte'?'selected':''}>≤</option></select><input data-f-value value="${E(r.value??'')}" placeholder="값 또는 ID"><button onclick="this.closest('[data-filter-row]').remove()">×</button></div>`}
function addFilterRow(){document.getElementById('filterRows').insertAdjacentHTML('beforeend',filterRow())}function clearFilter(){tx('Filter 초기화',()=>curt().filter={op:'and',items:[]});closeModal()}function saveFilter(){const items=[...document.querySelectorAll('[data-filter-row]')].map(r=>({type:'condition',inputId:r.querySelector('[data-f-input]').value,operator:r.querySelector('[data-f-op]').value,value:r.querySelector('[data-f-value]').value}));tx('Filter 변경',()=>curt().filter={op:'and',items});closeModal()}
function sortModal(){const p=page(),t=curt(),ids=['bookmark','record'].includes(t.type)?schemaInputs(t):[];const s=t.sort?.[0]||{},dir=s.direction||t.titleSortDirection||'asc';modal('Sort',`<div class="form">${ids.length?`<label>Input<select id="sortI"><option value="">기본 이름순</option>${ids.map(id=>`<option value="${id}" ${s.inputId===id?'selected':''}>${E(p.inputs[id].name)}</option>`).join('')}</select></label>`:'<input id="sortI" type="hidden" value="">'}<label>방향<select id="sortD"><option value="asc" ${dir!=='desc'?'selected':''}>오름차순</option><option value="desc" ${dir==='desc'?'selected':''}>내림차순</option></select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveSort()">저장</button>`)}function saveSort(){const i=document.getElementById('sortI').value,d=document.getElementById('sortD').value;tx('Sort 변경',()=>{const t=curt();t.sort=i?[{inputId:i,direction:d}]:[];t.titleSortDirection=d});closeModal()}
function folderModal(){const p=page(),sel=curt()?.type==='bookmark'&&rt.selected.size;modal('Folder 관리',`<div class="form">${sel?`<div class="notice">선택된 Bookmark ${rt.selected.size}개</div><label>선택 항목 이동<select id="moveFolder"><option value="">Unfiled</option>${Object.values(p.folders).map(f=>`<option value="${f.id}">${E(f.name)}</option>`).join('')}</select></label><button onclick="moveSelectedFolder()">선택 항목 이동</button>`:''}<div class="row"><input id="newFolder" placeholder="새 Folder 이름"><span></span><button onclick="createFolder(${sel?'true':'false'})">${sel?'생성 + 선택 항목 이동':'생성'}</button></div>${Object.values(p.folders).map(f=>`<div class="row"><input id="fn-${f.id}" value="${E(f.name)}"><button onclick="renameFolder('${f.id}')">이름 변경</button><button class="danger" onclick="delFolder('${f.id}')">삭제</button></div>`).join('')}</div>`)}
function moveSelectedFolder(){const fid=document.getElementById('moveFolder').value;tx('Folder 이동',()=>{for(const id of rt.selected){const b=page().bookmarks[id];if(!b)continue;if(fid)b.folderId=fid;else delete b.folderId}});rt.selected.clear();closeModal()}function renameFolder(id){const n=document.getElementById('fn-'+id).value.trim();if(!n)return;tx('Folder 이름 변경',()=>page().folders[id].name=n);closeModal()}
function tagHeadModal(){const p=page();modal('Tag Head 관리',`<div class="form"><div class="row"><input id="newHead" placeholder="새 Head"><span></span><button onclick="createHead()">생성</button></div>${p.tagHeadOrder.filter(id=>p.tagHeads[id]).map((id,i)=>{const h=p.tagHeads[id];return `<div class="orderrow"><button class="mini" onclick="moveHead('${id}',-1)">↑</button><button class="mini" onclick="moveHead('${id}',1)">↓</button><input id="hn-${id}" value="${E(h.name)}"><span class="inline-actions"><button onclick="renameHead('${id}')">저장</button><button class="danger" onclick="deleteHeadFlow('${id}')">삭제</button></span></div>`}).join('')}</div>`)}function createHead(){const n=document.getElementById('newHead').value.trim();if(!n)return;tx('Tag Head 생성',()=>{const p=page(),id=alloc(p,'tagHead');p.tagHeads[id]={id,name:n};p.tagHeadOrder.push(id)});closeModal()}function moveHead(id,d){tx('Tag Head 순서',()=>moveIn(page().tagHeadOrder,id,d));closeModal()}function renameHead(id){const n=document.getElementById('hn-'+id).value.trim();if(!n)return;tx('Tag Head 이름',()=>page().tagHeads[id].name=n);closeModal()}
function editSimple(id){const t=curt(),p=page(),col=t.type==='tag'?p.tags:p.categories,x=id?col[id]:null;modal(id?'편집':'새 '+(t.type==='tag'?'Tag':'Category'),`<div class="form"><label>이름<input id="simpleName" value="${E(x?.name||'')}"></label>${t.type==='tag'?`<label>Tag Head<select id="tagHead"><option value="">없음</option>${p.tagHeadOrder.filter(h=>p.tagHeads[h]).map(h=>`<option value="${h}" ${x?.headId===h?'selected':''}>${E(p.tagHeads[h].name)}</option>`).join('')}</select></label>`:`<label>상위 Category<select id="parent"><option value="">없음</option>${Object.values(p.categories).filter(c=>c.id!==id).map(c=>`<option value="${c.id}" ${x?.parentId===c.id?'selected':''}>${E(c.name)}</option>`).join('')}</select></label>`}</div>`,`<button onclick="closeModal()">취소</button>${id?`<button class="danger" onclick="deleteSimple('${id}')">삭제</button>`:''}<button class="primary" onclick="saveSimple('${id||''}')">저장</button>`)}
function saveSimple(id){const t=curt(),p=page(),col=t.type==='tag'?p.tags:p.categories,name=document.getElementById('simpleName').value.trim();if(!name)return toast('이름을 입력하세요.');tx('분류 정보 저장',()=>{const x=id?col[id]:{id:alloc(p,t.type==='tag'?'tag':'category')};x.name=name;if(t.type==='category'){const par=document.getElementById('parent').value;if(par)x.parentId=par;else delete x.parentId}else{const h=document.getElementById('tagHead').value;if(h)x.headId=h;else delete x.headId}col[x.id]=x});closeModal()}
function deleteSimple(id){const t=curt(),p=page();tx('분류 정보 삭제',()=>{if(t.type==='tag'){delete p.tags[id];for(const e of [...Object.values(p.bookmarks),...Object.values(p.records)])for(const [iid,v] of Object.entries(e.values||{})){const inp=p.inputs[iid];if(inp?.type==='relation'&&inp.target==='tag'){if(Array.isArray(v)){e.values[iid]=v.filter(z=>z!==id);if(!e.values[iid].length)delete e.values[iid]}else if(v===id)delete e.values[iid]}}}else{const par=p.categories[id]?.parentId;delete p.categories[id];for(const c of Object.values(p.categories))if(c.parentId===id){if(par)c.parentId=par;else delete c.parentId}for(const e of [...Object.values(p.bookmarks),...Object.values(p.records)])for(const [iid,v] of Object.entries(e.values||{})){const inp=p.inputs[iid];if(inp?.type==='relation'&&inp.target==='category'){if(Array.isArray(v)){e.values[iid]=v.filter(z=>z!==id);if(!e.values[iid].length)delete e.values[iid]}else if(v===id)delete e.values[iid]}}}});closeModal()}
function bulkEditModal(){const p=page(),t=curt(),ids=schemaInputs(t);modal('일괄 편집',`<div class="notice">선택 ${rt.selected.size}개. 다중 Relation은 추가/제거, 일반 값은 설정/비우기를 지원합니다.</div><div class="form"><label>Input<select id="bulkI">${ids.map(id=>`<option value="${id}">${E(p.inputs[id].name)}</option>`).join('')}</select></label><label>작업<select id="bulkOp"><option value="set">설정/교체</option><option value="add">추가</option><option value="remove">제거</option><option value="clear">비우기</option></select></label><label>값<input id="bulkV" placeholder="Relation은 ID, 여러 개는 쉼표"></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="applyBulkEdit()">적용</button>`)}
function applyBulkEdit(){const p=page(),t=curt(),iid=document.getElementById('bulkI').value,op=document.getElementById('bulkOp').value,raw=document.getElementById('bulkV').value,inp=p.inputs[iid],vals=raw.split(',').map(x=>x.trim()).filter(Boolean);tx('Bulk Input 편집',()=>{const col=t.type==='bookmark'?p.bookmarks:p.records;for(const id of rt.selected){const e=col[id];if(!e)continue;if(op==='clear'){delete e.values[iid];continue}let nv=inp.type==='relation'&&inp.multiple?vals:(inp.type==='number'?Number(raw):raw);if(op==='set')e.values[iid]=nv;else if(inp.type==='relation'&&inp.multiple){const cur=Array.isArray(e.values[iid])?e.values[iid]:[];e.values[iid]=op==='add'?[...new Set([...cur,...vals])]:cur.filter(x=>!vals.includes(x));if(!e.values[iid].length)delete e.values[iid]}}});closeModal()}
function schemaModal(){const p=page(),t=curt(),s=p.schemas[t.schemaId];modal('Field / Input',`<div class="notice">↑↓로 Field 순서를 변경할 수 있습니다. Field 삭제는 실제 Input 값은 삭제하지 않습니다.</div><div class="form" style="margin-top:10px">${s.fieldOrder.map(g=>{const f=s.fields[g],q=f.placements[f.placementOrder[0]],i=q?p.inputs[q.inputId]:null;return `<div class="orderrow"><button class="mini" onclick="moveField('${g}',-1)">↑</button><button class="mini" onclick="moveField('${g}',1)">↓</button><input data-g="${g}" value="${E(f.name)}"><span>${E(i?.name||'빈 Field')} · ${E(i?.type||'')}</span></div>`}).join('')}<button onclick="addFieldUI()">＋ 새 Input + Field</button></div>`,`<button onclick="closeModal()">닫기</button><button class="primary" onclick="saveFieldNames()">이름 저장</button>`)}function moveField(id,d){tx('Field 순서 변경',()=>moveIn(page().schemas[curt().schemaId].fieldOrder,id,d));closeModal()}
function pageSettings(){const p=page();modal('Page Settings',`<div class="form"><label>이름<input id="pname" value="${E(p.name)}"></label><label>설명<textarea id="pdesc">${E(p.description)}</textarea></label><div class="notice">Tab 생성/삭제/순서 변경은 여기서 관리합니다.</div>${p.tabOrder.map(id=>`<div class="orderrow"><button class="mini" onclick="moveTab('${id}',-1)">↑</button><button class="mini" onclick="moveTab('${id}',1)">↓</button><b>${E(p.tabs[id].name)}</b><button class="mini" onclick="duplicateTabNow('${id}')">복제</button><button class="danger mini" onclick="deleteTabNow('${id}')">삭제</button></div>`).join('')}<label>새 Tab 종류<select id="newTabType"><option value="bookmark">Bookmark</option><option value="record">Record</option><option value="tag">Tag</option><option value="category">Category</option></select></label><button onclick="createTab()">＋ Tab 생성</button><button onclick="duplicatePage()">Page 복제</button></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="savePageSettings()">저장</button>`)}function moveTab(id,d){tx('Tab 순서 변경',()=>moveIn(page().tabOrder,id,d));closeModal()}function deleteTabNow(id){tx('Tab 삭제',()=>{const p=page(),t=p.tabs[id];if(t?.schemaId)delete p.schemas[t.schemaId];delete p.tabs[id];p.tabOrder=p.tabOrder.filter(x=>x!==id);if(rt.tabId===id)rt.tabId=p.tabOrder[0]||null});closeModal()}
function tabSettings(){const t=curt();modal('Tab Settings',`<div class="form"><label>이름<input id="tabName" value="${E(t.name)}"></label><label>Layout<select id="layout"><option value="grid" ${t.layout.mode==='grid'?'selected':''}>Grid</option><option value="list" ${t.layout.mode==='list'?'selected':''}>List</option></select></label>${t.type==='bookmark'?'<div class="notice">Bookmark Folder는 실제 데이터 관계입니다.</div>':''}${t.type==='record'?'<div class="notice">Record Auto Folder는 현재 Tab의 표시 설정입니다.</div>':''}</div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveTabSettings()">저장</button>`)}

function editEntity(id){const t=curt(),p=page(),col=t.type==='bookmark'?p.bookmarks:p.records,e=id?col[id]:{id:null,values:{}};const s=p.schemas[t.schemaId];let html='<div class="form">';for(const gid of s.fieldOrder){const f=s.fields[gid];for(const qid of f.placementOrder){const pl=f.placements[qid],inp=p.inputs[pl.inputId],v=e.values?.[inp.id];html+=editor(inp,v)}}if(t.type==='bookmark'){html+=`<label>Folder<select id="folderId"><option value="">Unfiled</option>${Object.values(p.folders).map(f=>`<option value="${f.id}" ${e.folderId===f.id?'selected':''}>${E(f.name)}</option>`).join('')}</select></label>`;const rel=schemaInputs(t).map(i=>p.inputs[i]).find(i=>i?.type==='relation'&&i.target==='record');if(rel)html+=`<button type="button" onclick="characterWizard('${rel.id}')">＋ 등장인물 / Record 추가</button>`}html+='</div>';modal(id?'편집':'새 '+(t.type==='bookmark'?'Bookmark':'Record'),html,`<button onclick="closeModal()">취소</button>${id?`<button class="danger" onclick="deleteOne('${id}')">삭제</button>`:''}<button class="primary" onclick="saveEntity('${id||''}')">저장</button>`)}

function deleteHeadMove(id){const to=document.getElementById('headMoveTo')?.value;if(!to)return toast('이동할 Head가 없습니다.');tx('Tag Head 삭제/이동',()=>{const p=page();for(const t of Object.values(p.tags))if(t.headId===id)t.headId=to;delete p.tagHeads[id];p.tagHeadOrder=p.tagHeadOrder.filter(x=>x!==id)});closeModal()}
function deleteHeadAndTags(id){tx('Tag Head + Tag 삭제',()=>{const p=page(),ids=Object.values(p.tags).filter(t=>t.headId===id).map(t=>t.id);detachTagRefs(ids);for(const tid of ids)delete p.tags[tid];delete p.tagHeads[id];p.tagHeadOrder=p.tagHeadOrder.filter(x=>x!==id)});closeModal()}
function createDemoPage(){closeModal();let pid;tx('테스트 Page 생성',()=>{const p=seedTestData(makePage('테스트 Page'));p.description='v4.05 테스트 데이터';p.id=alloc(db,'page');pid=p.id;db.pages[pid]=p;db.main.pageOrder.push(pid)});if(pid){rt.pageId=pid;rt.tabId=db.pages[pid].tabOrder[0]||null;rt.selected.clear();rt.search='';render();toast('테스트 Page를 생성했습니다.')}}
// v4.04 legacy convenience functions, implemented on the v4 data model.
function clearSelection(){rt.selected.clear();body()}
function cloneEntity(id){const t=curt(),p=page();if(!['bookmark','record'].includes(t?.type))return;const col=t.type==='bookmark'?p.bookmarks:p.records,src=col[id];if(!src)return;tx('Entity 복제',()=>{const n=C(src),nid=alloc(p,t.type);n.id=nid;n.createdAt=Date.now();n.updatedAt=n.createdAt;col[nid]=n});closeModal();toast('복제했습니다.')}
function copyRecordLinks(inputId){const el=document.querySelector(`[data-i="${inputId}"]`);if(!el)return toast('등장인물 입력을 찾을 수 없습니다.');const ids=[...el.selectedOptions].map(o=>o.value).filter(Boolean);if(!ids.length)return toast('복사할 등장인물을 선택하세요.');rt.recordClipboard=[...new Set(ids)];toast(`${rt.recordClipboard.length}명의 등장인물을 복사했습니다.`)}
function pasteRecordClipboard(){const t=curt(),p=page();if(t?.type!=='bookmark')return;if(!rt.selected.size)return toast('붙여넣을 Bookmark를 선택하세요.');if(!rt.recordClipboard.length)return toast('먼저 Bookmark 편집에서 등장인물을 복사하세요.');const rel=schemaInputs(t).map(i=>p.inputs[i]).find(i=>i?.type==='relation'&&i.target==='record');if(!rel)return toast('현재 Schema에 Record Relation Input이 없습니다.');tx('등장인물 붙여넣기',()=>{for(const id of rt.selected){const b=p.bookmarks[id];if(!b)continue;const old=Array.isArray(b.values?.[rel.id])?b.values[rel.id]:(b.values?.[rel.id]?[b.values[rel.id]]:[]);b.values[rel.id]=[...new Set([...old,...rt.recordClipboard])];b.updatedAt=Date.now()}});rt.selected.clear();toast('선택한 Bookmark에 등장인물을 붙여넣었습니다.')}
function duplicateTabNow(id){const p=page(),src=p.tabs[id];if(!src)return;tx('Tab 복제',()=>{let sid=null;if(src.schemaId&&p.schemas[src.schemaId])sid=cloneSchema(p,p.schemas[src.schemaId]);const nid=alloc(p,'tab'),n=C(src);n.id=nid;n.name=src.name+' Copy';if(sid)n.schemaId=sid;p.tabs[nid]=n;const at=p.tabOrder.indexOf(id);p.tabOrder.splice(at+1,0,nid)});closeModal();toast('Tab을 복제했습니다.')}
function quickChildCategory(parentId){const p=page(),par=p.categories[parentId];if(!par)return;closeModal();modal('하위 Category 추가',`<div class="form"><div class="notice">${E(par.name)} 아래에 생성합니다.</div><label>이름<input id="childCatName"></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="createChildCategory('${parentId}')">생성</button>`)}
function createChildCategory(parentId){const name=document.getElementById('childCatName').value.trim();if(!name)return toast('이름을 입력하세요.');tx('하위 Category 생성',()=>{const p=page(),id=alloc(p,'category');p.categories[id]={id,name,parentId}});closeModal()}
load().catch(e=>{document.getElementById('app').innerHTML='<div class="empty">시작 실패: '+E(e.message)+'</div>'});
</script></body></html>
