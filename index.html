function savePageSettings(){tx('Page 설정',()=>{page().name=document.getElementById('pname').value.trim()||page().name;page().description=document.getElementById('pdesc').value});closeModal()}function createTab(){const type=document.getElementById('newTabType').value,p=page();tx('Tab 생성',()=>{let sid=null,sourceTab=null;if(type==='bookmark'||type==='record'){sourceTab=Object.values(p.tabs).find(t=>t.type===type&&t.schemaId&&p.schemas[t.schemaId])||null;const base=sourceTab?p.schemas[sourceTab.schemaId]:Object.values(p.schemas).find(s=>s.entityType===type);sid=cloneSchema(p,base)}const nid=tab(p,type==='record'?'Record':type==='bookmark'?'북마크':type==='tag'?'태그':'카테고리',type,sid);if(type==='bookmark'){p.tabs[nid].folderHeaderInputs=C(sourceTab?.folderHeaderInputs||[]);p.tabs[nid].convenience=C(sourceTab?.convenience||{meta:{pageInputId:null,durationInputId:null},quickTagHeadIds:[],recordQuickAdd:{relationInputId:null,nameInputId:p.convenience?.recordPrimaryInputId||null,roleInputId:null,genderInputId:null,seriesInputId:null,tagInputId:null,characterRoleValue:'Character',castRoleValue:'Cast',genderOptions:['Male','Female','Both']}})}});closeModal()}function cloneSchema(p,src){const sid=alloc(p,'schema'),s={id:sid,entityType:src.entityType,fieldOrder:[],fields:{},inputDisplay:C(src.inputDisplay||{})};for(const og of src.fieldOrder){const of=src.fields[og],ng=alloc(p,'field'),nf={...C(of),id:ng,placementOrder:[],placements:{}};for(const oq of of.placementOrder){const op=of.placements[oq],nq=alloc(p,'placement');nf.placementOrder.push(nq);nf.placements[nq]={...C(op),id:nq}}s.fieldOrder.push(ng);s.fields[ng]=nf}p.schemas[sid]=s;return sid}

function conditionMatch(e,c){const p=page(),inp=p.inputs[c.inputId],raw=e.values?.[c.inputId];if(c.operator==='empty')return raw===undefined||raw===''||(Array.isArray(raw)&&!raw.length);if(c.operator==='notEmpty')return !conditionMatch(e,{...c,operator:'empty'});if(raw===undefined)return false;const vals=Array.isArray(raw)?raw:[raw],want=c.value;switch(c.operator){case'equals':return vals.some(v=>String(v)===String(want));case'notEquals':return vals.every(v=>String(v)!==String(want));case'contains':return inp?.type==='relation'?vals.includes(want):String(raw).toLowerCase().includes(String(want).toLowerCase());case'excludes':return !vals.includes(want);case'gt':return Number(raw)>Number(want);case'gte':return Number(raw)>=Number(want);case'lt':return Number(raw)<Number(want);case'lte':return Number(raw)<=Number(want);default:return true}}

function searchEntityText(t,e,scope='all'){const p=page();if(scope==='title')return String(titleOf(t,e));if(t.type==='tag'||t.type==='category')return String(e.name||'');const parts=[];for(const [iid,v] of Object.entries(e.values||{})){const inp=p.inputs[iid];if(!inp)continue;if(scope==='tag'&&!(inp.type==='relation'&&inp.target==='tag'))continue;if(scope==='record'&&!(inp.type==='relation'&&inp.target==='record'))continue;if(scope==='category'&&!(inp.type==='relation'&&inp.target==='category'))continue;parts.push(displayValue(inp,v))}if(scope==='all')parts.unshift(titleOf(t,e));return parts.join(' ')}
function filtered(t){let a=entities(t).filter(e=>filterMatch(e,t.filter));if(t.type==='bookmark'&&rt.quickCategoryId){const desc=categoryDescendants(rt.quickCategoryId);a=a.filter(e=>Object.entries(e.values||{}).some(([iid,v])=>{const inp=page().inputs[iid];if(!(inp?.type==='relation'&&inp.target==='category'))return false;const vals=Array.isArray(v)?v:[v];return vals.some(id=>desc.has(id))}))}const q=rt.search.trim().toLowerCase();if(q)a=a.filter(e=>searchEntityText(t,e,rt.searchScope||'all').toLowerCase().includes(q));const sorts=t.sort||[];a.sort((A,B)=>{for(const so of sorts){let d=0;if(so.inputId==='__updatedAt')d=(Number(A.updatedAt)||0)-(Number(B.updatedAt)||0);else{const av=A.values?.[so.inputId],bv=B.values?.[so.inputId];d=String(displayValue(page().inputs[so.inputId],av)).localeCompare(String(displayValue(page().inputs[so.inputId],bv),undefined,{numeric:true}))}if(d)return so.direction==='desc'?-d:d}const d=String(titleOf(t,A)).localeCompare(String(titleOf(t,B),undefined,{numeric:true}));return t.titleSortDirection==='desc'?-d:d});return a}

function bookmarkTabView(t){const p=page(),a=filtered(t),dir=t.sort?.[0]?.direction||t.titleSortDirection||'asc',sortKey=t.sort?.[0]?.inputId||'__title',cats=Object.values(p.categories).sort((a,b)=>categoryPathName(a.id).localeCompare(categoryPathName(b.id),undefined,{numeric:true})),folderCount=new Set(a.filter(x=>x.folderId).map(x=>x.folderId)).size,sortOpts=[`<option value="__title" ${sortKey==='__title'?'selected':''}>제목</option>`,`<option value="__updatedAt" ${sortKey==='__updatedAt'?'selected':''}>최근 수정</option>`,...schemaInputs(t).filter(id=>p.inputs[id]?.type!=='longtext').map(id=>`<option value="${id}" ${sortKey===id?'selected':''}>${E(p.inputs[id].name)}</option>`)].join('');return `<div class="bookmark-shell"><div class="bookmark-searchbar"><input class="legacy-search" type="search" placeholder="" value="${E(rt.search)}" oninput="rt.search=this.value;body()"><select onchange="setBookmarkSearchScope(this.value)"><option value="all" ${rt.searchScope==='all'?'selected':''}>전체 + 모든 정보</option><option value="title" ${rt.searchScope==='title'?'selected':''}>제목</option><option value="tag" ${rt.searchScope==='tag'?'selected':''}>태그</option><option value="record" ${rt.searchScope==='record'?'selected':''}>등장인물 / Record</option><option value="category" ${rt.searchScope==='category'?'selected':''}>Category</option></select><select onchange="setBookmarkQuickSort(this.value)">${sortOpts}</select><select class="legacy-category" onchange="setBookmarkCategory(this.value)"><option value="">Category 전체</option>${cats.map(c=>`<option value="${c.id}" ${rt.quickCategoryId===c.id?'selected':''}>${E(categoryPathName(c.id)||c.name)}</option>`).join('')}</select><button class="bookmark-sortdir" onclick="toggleSortDirQuick()">${dir==='desc'?'내림차순':'오름차순'}</button></div><div class="bookmark-stats">${a.length}개 표시 · Folder ${folderCount}개</div><div class="bookmark-actionbar"><button class="primary" onclick="addEntity()">＋ Bookmark</button><button onclick="folderModal()">Folder</button><button onclick="filterModal()">Filter${t.filter?.items?.length?` (${t.filter.items.length})`:''}</button><button onclick="schemaModal()">Field / Input</button><button onclick="tabSettings()">Tab Settings</button><span class="spacer"></span><button onclick="toggleLayoutQuick()">${t.layout.mode==='list'?'☷ List':'▦ Grid'}</button><button onclick="toggleSelect()">${rt.select?'선택 종료':'선택'}</button></div>${rt.selected.size?`<div class="bookmark-bulkbar"><span class="count">${rt.selected.size}개 선택</span><button onclick="selectAll()">현재 목록 전체 선택</button><button onclick="clearSelection()">선택 해제</button><button class="primary" onclick="bulkRelationQuick('tag')">태그 추가</button><button onclick="bulkRelationQuick('category')">카테고리 추가</button><button onclick="folderModal()">Folder 이동</button><button onclick="pasteRecordClipboard()">등장인물 붙여넣기</button><button onclick="bulkEditModal()">일괄 편집</button><button class="danger" onclick="bulkDelete()">삭제</button></div>`:''}<div class="bookmark-results">${renderEntities(t,a)}</div></div>`}
function tabView(t){if(t.type==='bookmark')return bookmarkTabView(t);const a=filtered(t),add=t.type==='record'?'＋ Record':t.type==='tag'?'＋ Tag':'＋ Category',fcount=t.filter?.items?.length||0,dir=t.sort?.[0]?.direction||t.titleSortDirection||'asc';return `<div class="toolbar"><input placeholder="검색" value="${E(rt.search)}" oninput="rt.search=this.value;body()"><button class="primary" onclick="addEntity()">${add}</button>${t.type==='record'?'<button onclick="groupModal()">Auto Folder</button>':''}${t.type==='tag'?'<button onclick="tagHeadModal()">Tag Head</button>':''}<button onclick="filterModal()">Filter${fcount?` (${fcount})`:''}</button><button onclick="sortModal()">Sort</button><button onclick="toggleSortDirQuick()">${dir==='desc'?'↓ Z→A':'↑ A→Z'}</button><button onclick="toggleLayoutQuick()">${t.layout.mode==='list'?'☷ List':'▦ Grid'}</button><button onclick="toggleSelect()">${rt.select?'선택 종료':'선택'}</button><button onclick="schemaModal()" ${!['bookmark','record'].includes(t.type)?'disabled':''}>Field / Input</button><button onclick="tabSettings()">Tab Settings</button></div>${rt.select?`<div class="selectbar"><b>${rt.selected.size}개 선택</b><button onclick="selectAll()">전체 선택</button><button onclick="clearSelection()">선택 해제</button>${t.type==='record'?'<button onclick="bulkRelationQuick(\'tag\')">태그 추가</button><button onclick="bulkRelationQuick(\'category\')">카테고리 추가</button><button onclick="bulkEditModal()">일괄 편집</button>':''}<button class="danger" onclick="bulkDelete()">삭제</button></div>`:''}${renderEntities(t,a)}`}
function toggleLayoutQuick(){tx('Tab Layout 변경',()=>{const t=curt();t.layout=t.layout||{mode:'grid'};t.layout.mode=t.layout.mode==='list'?'grid':'list'})}function toggleSortDirQuick(){tx('Sort 방향 변경',()=>{const t=curt();if(t.sort?.length)t.sort[0].direction=t.sort[0].direction==='desc'?'asc':'desc';else t.titleSortDirection=t.titleSortDirection==='desc'?'asc':'desc'})}
function categoryTree(parent=null,depth=0,allowed=null){const p=page(),kids=Object.values(p.categories).filter(c=>(c.parentId||null)===parent&&(!allowed||allowed.has(c.id))).sort((a,b)=>a.name.localeCompare(b.name));return kids.map(c=>`<div class="catrow ${rt.selected.has(c.id)?'sel':''}" style="padding-left:${depth*16}px"><span onclick="${rt.select?`pick('${c.id}')`:`editSimple('${c.id}')`}" style="cursor:pointer">${depth?'↳ ':''}<b>${E(c.name)}</b> <span class="muted">${c.id}</span></span><span class="inline-actions">${rt.select?`<input class="cardcheck" type="checkbox" ${rt.selected.has(c.id)?'checked':''} onclick="event.stopPropagation();pick('${c.id}')">`:''}<button class="mini" onclick="event.stopPropagation();quickChildCategory('${c.id}')">하위＋</button><button class="mini" onclick="event.stopPropagation();editSimple('${c.id}')">편집</button></span></div>${categoryTree(c.id,depth+1,allowed)}`).join('')}

function folderHeaderSummary(t,items){const p=page(),ids=(t.folderHeaderInputs||[]).filter(id=>p.inputs[id]);const chips=[];for(const iid of ids){const inp=p.inputs[iid],vals=[];for(const e of items){const raw=e.values?.[iid];if(raw===undefined)continue;if(Array.isArray(raw)){for(const v of raw){const x=displayValue(inp,v);if(x&&!vals.includes(x))vals.push(x)}}else{const x=displayValue(inp,raw);if(x&&!vals.includes(x))vals.push(x)}}if(!vals.length)continue;const shown=vals.length<=2?vals.join(' · '):`${vals.slice(0,2).join(' · ')} 외 ${vals.length-2}`;chips.push(`<span class="chip"><b>${E(inp.name)}</b> ${E(shown)}</span>`)}return chips.length?`<div class="foldersummary">${chips.join('')}</div>`:''}
function toggleBookmarkFolder(id){rt.collapsedFolders.has(id)?rt.collapsedFolders.delete(id):rt.collapsedFolders.add(id);body()}
function renderEntities(t,a){
 const p=page();
 if(t.type==='category'){
  if(!a.length)return '<div class="empty">표시할 Category가 없습니다.</div>';
  const allowed=new Set();
  for(const c of a){let cur=c;while(cur){allowed.add(cur.id);cur=cur.parentId?p.categories[cur.parentId]:null}}
  return `<div class="card">${categoryTree(null,0,allowed)}</div>`;
 }
 if(t.type==='tag'){
  const heads=[...p.tagHeadOrder.filter(id=>p.tagHeads[id]),...Object.keys(p.tagHeads).filter(id=>!p.tagHeadOrder.includes(id))],loose=a.filter(x=>!x.headId);
  const tagButton=x=>`<button class="chip ${rt.selected.has(x.id)?'selchip':''}" onclick="${rt.select?`pick('${x.id}')`:`editSimple('${x.id}')`}">${rt.select?(rt.selected.has(x.id)?'✓ ':'□ '):''}${E(x.name)}</button>`;
  return `${heads.map(hid=>{const h=p.tagHeads[hid],ts=a.filter(x=>x.headId===hid);return `<div class="headbox"><div class="folderhead"><b>${E(h.name)}</b><span class="muted">${ts.length}개</span></div><div class="chips">${ts.map(tagButton).join('')||'<span class="muted">Tag 없음</span>'}</div></div>`}).join('')}${loose.length?`<div class="headbox"><b>Head 없음</b><div class="chips">${loose.map(tagButton).join('')}</div></div>`:''}`;
 }
 if(t.type==='bookmark'){
  const byFolder=new Map();for(const e of a)if(e.folderId){if(!byFolder.has(e.folderId))byFolder.set(e.folderId,[]);byFolder.get(e.folderId).push(e)}
  const unfiled=a.filter(e=>!e.folderId||!p.folders[e.folderId]),showEmpty=!rt.search&&!rt.quickCategoryId&&!(t.filter?.items?.length),parts=[];
  for(const f of Object.values(p.folders)){const items=byFolder.get(f.id)||[];if(!items.length&&!showEmpty)continue;const closed=rt.collapsedFolders.has(f.id);parts.push(`<section class="legacy-folder"><div class="legacy-folder-head"><div class="legacy-folder-title-row"><button class="legacy-folder-toggle" onclick="toggleBookmarkFolder('${f.id}')">${closed?'▶':'▼'} ${E(f.name)}</button><span class="legacy-folder-count">${items.length}개</span><button class="mini" onclick="folderModal()">수정</button></div><div class="legacy-folder-info">${folderHeaderSummary(t,items)}</div></div>${closed?'':`<div class="legacy-folder-body ${t.layout.mode==='grid'?'gridish':''}">${items.map(e=>card(t,e)).join('')||'<div class="empty">Folder가 비어 있습니다.</div>'}</div>`}</section>`)}
  if(unfiled.length)parts.push(`<div class="${t.layout.mode==='grid'?'legacy-card-grid':'legacy-card-list'}">${unfiled.map(e=>card(t,e)).join('')}</div>`);
  return parts.join('')||'<div class="empty">북마크가 없습니다.</div>';
 }
 if(!a.length)return '<div class="empty">표시할 항목이 없습니다.</div>';
 if(t.type==='record'&&t.grouping?.mode==='input'&&t.grouping.inputId){
  const groups=new Map();for(const e of a){let v=e.values?.[t.grouping.inputId],vals=Array.isArray(v)?v:[v??''];for(const k of vals){if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)}}
  return [...groups].map(([k,v])=>`<div class="folder"><div class="folderhead"><b>${E(displayValue(p.inputs[t.grouping.inputId],k)||'값 없음')}</b><span class="muted">${v.length}개</span></div><div class="folderbody ${t.layout.mode==='list'?'list':'grid'}">${v.map(e=>card(t,e)).join('')}</div></div>`).join('')
 }
 return `<div class="${t.layout.mode==='list'?'list':'grid'}">${a.map(e=>card(t,e)).join('')}</div>`
}
function unassignedValues(t,e){const p=page(),s=p.schemas[t.schemaId],used=new Set(s.fieldOrder.flatMap(g=>(s.fields[g]?.placementOrder||[]).map(q=>s.fields[g].placements[q]?.inputId)));return Object.entries(e.values||{}).filter(([iid])=>!used.has(iid)&&p.inputs[iid])}


function filterRow(r={},i=Date.now(),ids=Object.keys(page().inputs)){return `<div class="row" data-filter-row><select data-f-input>${ids.map(id=>`<option value="${id}" ${r.inputId===id?'selected':''}>${E(page().inputs[id].name)}</option>`).join('')}</select><select data-f-op><option value="contains" ${r.operator==='contains'?'selected':''}>포함</option><option value="equals" ${r.operator==='equals'?'selected':''}>같음</option><option value="excludes" ${r.operator==='excludes'?'selected':''}>제외</option><option value="empty" ${r.operator==='empty'?'selected':''}>값 없음</option><option value="notEmpty" ${r.operator==='notEmpty'?'selected':''}>값 있음</option><option value="gte" ${r.operator==='gte'?'selected':''}>≥</option><option value="lte" ${r.operator==='lte'?'selected':''}>≤</option></select><input data-f-value value="${E(r.value??'')}" placeholder="값 또는 ID"><button onclick="this.closest('[data-filter-row]').remove()">×</button></div>`}

function sortModal(){const p=page(),t=curt(),ids=['bookmark','record'].includes(t.type)?schemaInputs(t):[];const s=t.sort?.[0]||{},dir=s.direction||t.titleSortDirection||'asc';modal('Sort',`<div class="form"><label>기준<select id="sortI"><option value="">기본 이름순</option><option value="__updatedAt" ${s.inputId==='__updatedAt'?'selected':''}>최근 수정</option>${ids.map(id=>`<option value="${id}" ${s.inputId===id?'selected':''}>${E(p.inputs[id].name)}</option>`).join('')}</select></label><label>방향<select id="sortD"><option value="asc" ${dir!=='desc'?'selected':''}>오름차순</option><option value="desc" ${dir==='desc'?'selected':''}>내림차순</option></select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveSort()">저장</button>`)}function saveSort(){const i=document.getElementById('sortI').value,d=document.getElementById('sortD').value;tx('Sort 변경',()=>{const t=curt();t.sort=i?[{inputId:i,direction:d}]:[];t.titleSortDirection=d});closeModal()}
function folderModal(){const p=page(),sel=curt()?.type==='bookmark'&&rt.selected.size;modal('Folder 관리',`<div class="form">${sel?`<div class="notice">선택된 Bookmark ${rt.selected.size}개</div><label>선택 항목 이동<select id="moveFolder"><option value="">Unfiled</option>${Object.values(p.folders).map(f=>`<option value="${f.id}">${E(f.name)}</option>`).join('')}</select></label><button onclick="moveSelectedFolder()">선택 항목 이동</button>`:''}<div class="row"><input id="newFolder" placeholder="새 Folder 이름"><span></span><button onclick="createFolder(${sel?'true':'false'})">${sel?'생성 + 선택 항목 이동':'생성'}</button></div>${Object.values(p.folders).map(f=>`<div class="row"><input id="fn-${f.id}" value="${E(f.name)}"><button onclick="renameFolder('${f.id}')">이름 변경</button><button class="danger" onclick="delFolder('${f.id}')">삭제</button></div>`).join('')}</div>`)}
function moveSelectedFolder(){const fid=document.getElementById('moveFolder').value;tx('Folder 이동',()=>{for(const id of rt.selected){const b=page().bookmarks[id];if(!b)continue;if(fid)b.folderId=fid;else delete b.folderId}});rt.selected.clear();closeModal()}function renameFolder(id){const n=document.getElementById('fn-'+id).value.trim();if(!n)return;tx('Folder 이름 변경',()=>page().folders[id].name=n);closeModal()}
function tagHeadModal(){const p=page();modal('Tag Head 관리',`<div class="form"><div class="row"><input id="newHead" placeholder="새 Head"><span></span><button onclick="createHead()">생성</button></div>${p.tagHeadOrder.filter(id=>p.tagHeads[id]).map((id,i)=>{const h=p.tagHeads[id];return `<div class="orderrow"><button class="mini" onclick="moveHead('${id}',-1)">↑</button><button class="mini" onclick="moveHead('${id}',1)">↓</button><input id="hn-${id}" value="${E(h.name)}"><span class="inline-actions"><button onclick="renameHead('${id}')">저장</button><button class="danger" onclick="deleteHeadFlow('${id}')">삭제</button></span></div>`}).join('')}</div>`)}function createHead(){const n=document.getElementById('newHead').value.trim();if(!n)return;tx('Tag Head 생성',()=>{const p=page(),id=alloc(p,'tagHead');p.tagHeads[id]={id,name:n};p.tagHeadOrder.push(id)});closeModal()}function moveHead(id,d){tx('Tag Head 순서',()=>moveIn(page().tagHeadOrder,id,d));closeModal()}function renameHead(id){const n=document.getElementById('hn-'+id).value.trim();if(!n)return;tx('Tag Head 이름',()=>page().tagHeads[id].name=n);closeModal()}
function editSimple(id){const t=curt(),p=page(),col=t.type==='tag'?p.tags:p.categories,x=id?col[id]:null;modal(id?'편집':'새 '+(t.type==='tag'?'Tag':'Category'),`<div class="form"><label>이름<input id="simpleName" value="${E(x?.name||'')}"></label>${t.type==='tag'?`<label>Tag Head<select id="tagHead"><option value="">없음</option>${p.tagHeadOrder.filter(h=>p.tagHeads[h]).map(h=>`<option value="${h}" ${x?.headId===h?'selected':''}>${E(p.tagHeads[h].name)}</option>`).join('')}</select></label>`:`<label>상위 Category<select id="parent"><option value="">없음</option>${Object.values(p.categories).filter(c=>c.id!==id).map(c=>`<option value="${c.id}" ${x?.parentId===c.id?'selected':''}>${E(c.name)}</option>`).join('')}</select></label>`}</div>`,`<button onclick="closeModal()">취소</button>${id?`<button class="danger" onclick="deleteSimple('${id}')">삭제</button>`:''}<button class="primary" onclick="saveSimple('${id||''}')">저장</button>`)}
function saveSimple(id){const t=curt(),p=page(),col=t.type==='tag'?p.tags:p.categories,name=document.getElementById('simpleName').value.trim();if(!name)return toast('이름을 입력하세요.');tx('분류 정보 저장',()=>{const x=id?col[id]:{id:alloc(p,t.type==='tag'?'tag':'category')};x.name=name;if(t.type==='category'){const par=document.getElementById('parent').value;if(par)x.parentId=par;else delete x.parentId}else{const h=document.getElementById('tagHead').value;if(h)x.headId=h;else delete x.headId}col[x.id]=x});closeModal()}
function deleteSimple(id){const t=curt(),p=page();tx('분류 정보 삭제',()=>{if(t.type==='tag'){delete p.tags[id];for(const e of [...Object.values(p.bookmarks),...Object.values(p.records)])for(const [iid,v] of Object.entries(e.values||{})){const inp=p.inputs[iid];if(inp?.type==='relation'&&inp.target==='tag'){if(Array.isArray(v)){e.values[iid]=v.filter(z=>z!==id);if(!e.values[iid].length)delete e.values[iid]}else if(v===id)delete e.values[iid]}}}else{const par=p.categories[id]?.parentId;delete p.categories[id];for(const c of Object.values(p.categories))if(c.parentId===id){if(par)c.parentId=par;else delete c.parentId}for(const e of [...Object.values(p.bookmarks),...Object.values(p.records)])for(const [iid,v] of Object.entries(e.values||{})){const inp=p.inputs[iid];if(inp?.type==='relation'&&inp.target==='category'){if(Array.isArray(v)){e.values[iid]=v.filter(z=>z!==id);if(!e.values[iid].length)delete e.values[iid]}else if(v===id)delete e.values[iid]}}}});closeModal()}
function bulkEditModal(){const p=page(),t=curt(),ids=schemaInputs(t);modal('일괄 편집',`<div class="notice">선택 ${rt.selected.size}개. 다중 Relation은 추가/제거, 일반 값은 설정/비우기를 지원합니다.</div><div class="form"><label>Input<select id="bulkI">${ids.map(id=>`<option value="${id}">${E(p.inputs[id].name)}</option>`).join('')}</select></label><label>작업<select id="bulkOp"><option value="set">설정/교체</option><option value="add">추가</option><option value="remove">제거</option><option value="clear">비우기</option></select></label><label>값<input id="bulkV" placeholder="Relation은 ID, 여러 개는 쉼표"></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="applyBulkEdit()">적용</button>`)}

function openBookmarkUrl(id){const b=page().bookmarks[id],url=b?bookmarkUrl(b):'';if(!url)return toast('URL이 없습니다.');window.open(url,'_blank','noopener,noreferrer')}
function quickPick(id){rt.select=true;if(rt.selected.has(id))rt.selected.delete(id);else rt.selected.add(id);body()}
function repairDB(d){let fixed=0;for(const p of Object.values(d.pages||{})){for(const k of ['tabOrder','tagHeadOrder'])if(Array.isArray(p[k])){const valid=p[k].filter(id=>(k==='tabOrder'?p.tabs:p.tagHeads)?.[id]);if(valid.length!==p[k].length){p[k]=valid;fixed++}}for(const b of Object.values(p.bookmarks||{}))if(b.folderId&&!p.folders[b.folderId]){delete b.folderId;fixed++}for(const s of Object.values(p.schemas||{})){s.fieldOrder=(s.fieldOrder||[]).filter(id=>s.fields?.[id]);for(const f of Object.values(s.fields||{}))f.placementOrder=(f.placementOrder||[]).filter(id=>f.placements?.[id])}for(const c of Object.values(p.categories||{}))if(c.parentId&&!p.categories[c.parentId]){delete c.parentId;fixed++}if(ensureConvenienceConfig(p))fixed++;if(ensureBookmarkPresentation(p))fixed++}return fixed}
function dbCheck(){const before=validate(db);let fixed=0;if(before.length)tx('DB 자동 수리',()=>{fixed=repairDB(db)});const after=validate(db);modal('DB Check',`<div class="notice ${after.length?'dbwarn':'dbok'}">검사 완료 · 자동 수리 ${fixed}건 · 남은 오류 ${after.length}건</div>${after.length?`<div class="notice" style="margin-top:8px">${after.map(E).join('<br>')}</div>`:''}`)}
function virtualSlice(a){const LIMIT=300;if(a.length<=LIMIT)return a;return a.slice(0,LIMIT)}
const _renderEntities403=renderEntities;renderEntities=function(t,a){const cut=virtualSlice(a),html=_renderEntities403(t,cut);return a.length>cut.length?html+`<div class="notice" style="margin-top:10px">성능 보호를 위해 현재 ${cut.length}/${a.length}개를 표시합니다. 검색/필터로 범위를 좁히면 해당 결과가 표시됩니다.</div>`:html}

// v4.05 additional legacy convenience features.
function bulkRelationQuick(target){const t=curt(),p=page();if(!rt.selected.size)return toast('항목을 먼저 선택하세요.');const inp=schemaInputs(t).map(id=>p.inputs[id]).find(i=>i?.type==='relation'&&i.target===target&&i.multiple);if(!inp)return toast(`현재 Schema에 ${target} Relation Input이 없습니다.`);const m=target==='tag'?p.tags:p.categories,opts=Object.values(m).sort((a,b)=>String(a.name).localeCompare(String(b.name))).map(x=>`<option value="${x.id}">${E(x.name)}</option>`).join('');modal(target==='tag'?'태그 추가':'카테고리 추가',`<div class="form"><div class="notice">선택 ${rt.selected.size}개에 기존 항목을 추가합니다.</div><label>${target==='tag'?'Tag':'Category'}<select id="quickRel" multiple size="8">${opts}</select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="applyBulkRelationQuick('${inp.id}')">추가</button>`)}
function applyBulkRelationQuick(iid){const vals=[...document.getElementById('quickRel').selectedOptions].map(o=>o.value);if(!vals.length)return toast('추가할 항목을 선택하세요.');tx('Relation 일괄 추가',()=>{const p=page(),t=curt(),col=t.type==='bookmark'?p.bookmarks:p.records;for(const id of rt.selected){const e=col[id];if(!e)continue;const cur=Array.isArray(e.values?.[iid])?e.values[iid]:[];e.values[iid]=[...new Set([...cur,...vals])];e.updatedAt=Date.now()}});closeModal()}
function detachTagRefs(ids){const p=page(),set=new Set(ids);for(const e of [...Object.values(p.bookmarks),...Object.values(p.records)])for(const [iid,v] of Object.entries(e.values||{})){const inp=p.inputs[iid];if(inp?.type!=='relation'||inp.target!=='tag')continue;if(Array.isArray(v)){e.values[iid]=v.filter(x=>!set.has(x));if(!e.values[iid].length)delete e.values[iid]}else if(set.has(v))delete e.values[iid]}}
function deleteHeadFlow(id){const p=page(),h=p.tagHeads[id];if(!h)return;const tags=Object.values(p.tags).filter(t=>t.headId===id),others=p.tagHeadOrder.filter(x=>x!==id&&p.tagHeads[x]);closeModal();modal('Tag Head 삭제',`<div class="form"><div class="notice">${E(h.name)} · Tag ${tags.length}개</div>${tags.length&&others.length?`<label>Tag 이동 대상<select id="headMoveTo">${others.map(x=>`<option value="${x}">${E(p.tagHeads[x].name)}</option>`).join('')}</select></label><button onclick="deleteHeadMove('${id}')">Tag 이동 후 Head 삭제</button>`:''}<button class="danger" onclick="deleteHeadAndTags('${id}')">Head와 소속 Tag 함께 삭제</button></div>`,`<button onclick="closeModal()">취소</button>`)}
function deleteHeadMove(id){const to=document.getElementById('headMoveTo')?.value;if(!to)return toast('이동할 Head가 없습니다.');tx('Tag Head 삭제/이동',()=>{const p=page();for(const t of Object.values(p.tags))if(t.headId===id)t.headId=to;delete p.tagHeads[id];p.tagHeadOrder=p.tagHeadOrder.filter(x=>x!==id)});closeModal()}
function deleteHeadAndTags(id){tx('Tag Head + Tag 삭제',()=>{const p=page(),ids=Object.values(p.tags).filter(t=>t.headId===id).map(t=>t.id);detachTagRefs(ids);for(const tid of ids)delete p.tags[tid];delete p.tagHeads[id];p.tagHeadOrder=p.tagHeadOrder.filter(x=>x!==id)});closeModal()}
function createDemoPage(){closeModal();let pid;tx('테스트 Page 생성',()=>{pid=makeTestPage(db,VERSION);db.meta.testSeedInitialized=true});if(pid){rt.pageId=pid;rt.tabId=db.pages[pid].tabOrder[0]||null;rt.selected.clear();rt.search='';render();toast('샘플 Bookmark/Tag/Category/Record가 포함된 테스트 Page를 생성했습니다.')}}
// v4.04 legacy convenience functions, implemented on the v4 data model.
function clearSelection(){rt.selected.clear();body()}
function cloneEntity(id){const t=curt(),p=page();if(!['bookmark','record'].includes(t?.type))return;const col=t.type==='bookmark'?p.bookmarks:p.records,src=col[id];if(!src)return;tx('Entity 복제',()=>{const n=C(src),nid=alloc(p,t.type);n.id=nid;n.createdAt=Date.now();n.updatedAt=n.createdAt;col[nid]=n});closeModal();toast('복제했습니다.')}
function copyRecordLinks(inputId){const el=document.querySelector(`[data-i="${inputId}"]`);if(!el)return toast('등장인물 입력을 찾을 수 없습니다.');const ids=[...el.selectedOptions].map(o=>o.value).filter(Boolean);if(!ids.length)return toast('복사할 등장인물을 선택하세요.');rt.recordClipboard=[...new Set(ids)];toast(`${rt.recordClipboard.length}명의 등장인물을 복사했습니다.`)}
function pasteRecordClipboard(){const t=curt(),p=page();if(t?.type!=='bookmark')return;if(!rt.selected.size)return toast('붙여넣을 Bookmark를 선택하세요.');if(!rt.recordClipboard.length)return toast('먼저 Bookmark 편집에서 등장인물/Record를 복사하세요.');const relId=bookmarkRecordRelationId(t),rel=relId?p.inputs[relId]:null;if(!rel)return toast('Tab Settings에서 Bookmark → Record Relation을 연결하세요.');tx('등장인물/Record 붙여넣기',()=>{for(const id of rt.selected){const b=p.bookmarks[id];if(!b)continue;const old=Array.isArray(b.values?.[rel.id])?b.values[rel.id]:(b.values?.[rel.id]?[b.values[rel.id]]:[]);b.values[rel.id]=[...new Set([...old,...rt.recordClipboard])];b.updatedAt=Date.now()}});rt.selected.clear();toast('선택한 Bookmark에 Record 관계를 붙여넣었습니다.')}
function duplicateTabNow(id){const p=page(),src=p.tabs[id];if(!src)return;tx('Tab 복제',()=>{let sid=null;if(src.schemaId&&p.schemas[src.schemaId])sid=cloneSchema(p,p.schemas[src.schemaId]);const nid=alloc(p,'tab'),n=C(src);n.id=nid;n.name=src.name+' Copy';if(sid)n.schemaId=sid;p.tabs[nid]=n;const at=p.tabOrder.indexOf(id);p.tabOrder.splice(at+1,0,nid)});closeModal();toast('Tab을 복제했습니다.')}
function quickChildCategory(parentId){const p=page(),par=p.categories[parentId];if(!par)return;closeModal();modal('하위 Category 추가',`<div class="form"><div class="notice">${E(par.name)} 아래에 생성합니다.</div><label>이름<input id="childCatName"></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="createChildCategory('${parentId}')">생성</button>`)}
function createChildCategory(parentId){const name=document.getElementById('childCatName').value.trim();if(!name)return toast('이름을 입력하세요.');tx('하위 Category 생성',()=>{const p=page(),id=alloc(p,'category');p.categories[id]={id,name,parentId}});closeModal()}
load().catch(e=>{document.getElementById('app').innerHTML='<div class="empty">시작 실패: '+E(e.message)+'</div>'});
</script></body></html>
