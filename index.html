<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tagmark v4.00</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--line:#dfe5ee;--text:#17202b;--muted:#6d7785;--accent:#315efb;--danger:#c93d3d;--side:#111827;--side2:#26344d}*{box-sizing:border-box}html,body,#app{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.danger{color:var(--danger)}.app{display:flex;height:100%}.side{width:245px;background:var(--side);color:#fff;padding:16px;display:flex;flex-direction:column;gap:10px}.brand{font-weight:800;font-size:20px}.ver{color:#9ca3af;font-size:12px}.side button{background:#1f2937;color:#fff;border-color:#374151}.pages{display:flex;flex-direction:column;gap:5px;overflow:auto}.pitem{padding:10px;border-radius:8px;cursor:pointer}.pitem.on{background:var(--side2)}.main{flex:1;min-width:0;overflow:auto}.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:9px 16px;position:sticky;top:0;z-index:10}.content{padding:20px}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.muted{color:var(--muted);font-size:13px}.tabs,.toolbar,.actions{display:flex;gap:7px;flex-wrap:wrap}.tabs{border-bottom:1px solid var(--line);margin:16px 0 12px}.tab{border:0;background:transparent;border-radius:8px 8px 0 0;padding:10px 13px;color:var(--muted)}.tab.on{background:#fff;color:var(--accent);border:1px solid var(--line);border-bottom-color:#fff;margin-bottom:-1px}.toolbar{margin-bottom:12px}.toolbar input{min-width:240px;padding:9px;border:1px solid var(--line);border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:11px}.list{display:flex;flex-direction:column;gap:8px}.card,.folder,.pagecard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px}.card.sel{outline:2px solid #315efb66}.pagecard{cursor:pointer}.card h3,.pagecard h3{margin:0 0 8px}.chips{display:flex;gap:4px;flex-wrap:wrap}.chip{font-size:12px;background:#eef1f6;border-radius:999px;padding:4px 7px}.empty{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:40px;text-align:center;color:var(--muted)}.field{margin-top:8px}.fname{font-size:11px;color:var(--muted)}.modalback{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:15px;z-index:100}.modal{background:#fff;border-radius:14px;padding:18px;width:min(760px,100%);max-height:90vh;overflow:auto}.modal h2{margin:0 0 14px}.form{display:grid;gap:10px}.form label{font-size:13px;font-weight:650}.form input,.form select,.form textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px}.foot{display:flex;justify-content:flex-end;gap:7px;margin-top:15px}.row{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;align-items:center}.notice{background:#eef3ff;border-radius:9px;padding:10px;font-size:13px}.selectbar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;gap:7px;align-items:center;margin-bottom:10px}.folderhead{display:flex;justify-content:space-between;align-items:center}.folderbody{margin-top:9px}.sys{margin-top:auto}.status{margin-left:auto;font-size:12px;color:var(--muted)}
@media(max-width:720px){.side{width:170px}.content{padding:12px}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.toolbar input{min-width:140px;flex:1}}
</style></head><body><div id="app"></div><script>
'use strict';
const VERSION='4.00',FORMAT=1,DBNAME='tagmark-v400',STORE='current';
const C=x=>structuredClone(x), E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pref={page:'p',tab:'x',schema:'s',field:'g',placement:'q',input:'i',bookmark:'b',record:'r',tag:'t',tagHead:'h',category:'c',folder:'f'};
let db,idb; const rt={pageId:null,tabId:null,search:'',selected:new Set(),select:false,undo:[],redo:[],save:'saved'};
function b36(n){return n.toString(36)} function alloc(scope,k){const n=scope.ids[k]||1;scope.ids[k]=n+1;return pref[k]+b36(n)}
function input(p,name,type,target=null,multiple=false){const id=alloc(p,'input');p.inputs[id]={id,name,type,...(target?{target,multiple}:{} )};return id}
function schema(p,type,defs){const sid=alloc(p,'schema'),s={id:sid,entityType:type,fieldOrder:[],fields:{},inputDisplay:{}};for(const [name,iid] of defs){const gid=alloc(p,'field'),qid=alloc(p,'placement');s.fieldOrder.push(gid);s.fields[gid]={id:gid,name,placementOrder:[qid],placements:{[qid]:{id:qid,inputId:iid}}}}p.schemas[sid]=s;return sid}
function tab(p,name,type,schemaId=null){const id=alloc(p,'tab');p.tabs[id]={id,name,type,...(schemaId?{schemaId}:{}),filter:{op:'and',items:[]},sort:[],layout:{mode:'grid'},grouping:{mode:'none'}};p.tabOrder.push(id);return id}
function makePage(name='새 Page'){const p={id:null,name,description:'',icon:'📁',ids:{tab:1,schema:1,field:1,placement:1,input:1,bookmark:1,record:1,tag:1,tagHead:1,category:1,folder:1},inputs:{},schemas:{},bookmarks:{},records:{},tags:{},tagHeads:{},categories:{},folders:{},tabs:{},tabOrder:[],tagHeadOrder:[]};const title=input(p,'제목','text'),url=input(p,'URL','url'),note=input(p,'메모','longtext'),tags=input(p,'태그','relation','tag',true),cats=input(p,'카테고리','relation','category',true),related=input(p,'관련 Record','relation','record',true);const bs=schema(p,'bookmark',[['기본 정보',title],['URL',url],['메모',note],['태그',tags],['카테고리',cats],['관련 Record',related]]);const nameI=input(p,'이름','text'),desc=input(p,'설명','longtext'),rtags=input(p,'태그','relation','tag',true);const rs=schema(p,'record',[['기본 정보',nameI],['설명',desc],['태그',rtags]]);tab(p,'북마크','bookmark',bs);tab(p,'Record','record',rs);tab(p,'태그','tag');tab(p,'카테고리','category');return p}
function fresh(){const d={meta:{format:'tagmark',formatVersion:FORMAT,appVersion:VERSION,revision:0,createdAt:Date.now(),updatedAt:Date.now()},ids:{page:1},main:{pageOrder:[]},pages:{}};const p=makePage('새 Page');p.id=alloc(d,'page');d.pages[p.id]=p;d.main.pageOrder.push(p.id);return d}
function validate(d){const issues=[];if(d?.meta?.format!=='tagmark'||d?.meta?.formatVersion!==1)issues.push('v4 Format 1 파일이 아닙니다.');for(const pid of d?.main?.pageOrder||[])if(!d.pages?.[pid])issues.push('없는 Page가 pageOrder에 있습니다: '+pid);for(const [pid,p] of Object.entries(d?.pages||{})){if(p.id!==pid)issues.push(pid+' Page ID 불일치');for(const [bid,b] of Object.entries(p.bookmarks||{}))if(b.folderId&&!p.folders[b.folderId])issues.push(`${pid}/${bid}: 없는 Folder 참조`);for(const [cid,c] of Object.entries(p.categories||{})){let seen=new Set([cid]),cur=c.parentId;while(cur){if(seen.has(cur)){issues.push(`${pid}/${cid}: Category cycle`);break}seen.add(cur);cur=p.categories[cur]?.parentId}}}return issues}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){idb=await openDB();const tx=idb.transaction(STORE,'readonly'),r=tx.objectStore(STORE).get('db');db=await new Promise((res,rej)=>{r.onsuccess=()=>res(r.result||fresh());r.onerror=()=>rej(r.error)});if(validate(db).length)db=fresh();rt.pageId=db.main.pageOrder[0]||null;rt.tabId=rt.pageId?db.pages[rt.pageId].tabOrder[0]:null;render()}
async function persist(){rt.save='saving';renderStatus();db.meta.revision++;db.meta.updatedAt=Date.now();const snap=C(db),rev=snap.meta.revision;const tx=idb.transaction(STORE,'readwrite');tx.objectStore(STORE).put(snap,'db');await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});if(db.meta.revision===rev){rt.save='saved';renderStatus()}}
function tx(label,fn){const before=C(db);try{fn();const issues=validate(db);if(issues.length)throw Error(issues[0]);rt.undo.push({label,before,after:C(db)});if(rt.undo.length>60)rt.undo.shift();rt.redo=[];persist().then(render).catch(e=>{rt.save='failed';render();toast('저장 실패: '+e.message)})}catch(e){db=before;toast('작업 실패: '+e.message)}}
function undo(){const x=rt.undo.pop();if(!x)return;rt.redo.push(x);db=C(x.before);persist().then(render)}function redo(){const x=rt.redo.pop();if(!x)return;rt.undo.push(x);db=C(x.after);persist().then(render)}
function page(){return db.pages[rt.pageId]}function curt(){return page()?.tabs[rt.tabId]}
function render(){const a=document.getElementById('app');a.innerHTML=`<div class="app"><aside class="side"><div class="brand">Tagmark</div><div class="ver">v${VERSION} · v4 Canonical DB</div><button onclick="goMain()">⌂ Main</button><button onclick="newPage()">＋ Page</button><div class="pages">${db.main.pageOrder.map(id=>{const p=db.pages[id];return `<div class="pitem ${id===rt.pageId?'on':''}" onclick="openPage('${id}')">${E(p.icon)} ${E(p.name)}</div>`}).join('')}</div><div class="sys"><button style="width:100%" onclick="systemModal()">DB 관리</button></div></aside><main class="main"><div class="top"><button onclick="undo()" ${!rt.undo.length?'disabled':''}>↶</button><button onclick="redo()" ${!rt.redo.length?'disabled':''}>↷</button><span class="status" id="status"></span></div><div class="content" id="content"></div></main></div>`;body();renderStatus()}
function renderStatus(){const x=document.getElementById('status');if(x)x.textContent=rt.save==='saved'?'저장됨':rt.save==='saving'?'저장 중…':'저장 실패'}
function goMain(){rt.pageId=null;rt.tabId=null;rt.selected.clear();body()}function openPage(id){rt.pageId=id;rt.tabId=db.pages[id].tabOrder[0]||null;rt.search='';rt.selected.clear();render()}
function body(){const c=document.getElementById('content');if(!c)return;if(!rt.pageId){c.innerHTML=`<div class="head"><div><h1>Main</h1><div class="muted">Page는 서로 독립적인 데이터 공간입니다.</div></div><button class="primary" onclick="newPage()">＋ Page</button></div><div class="grid" style="margin-top:16px">${db.main.pageOrder.map(id=>{const p=db.pages[id];return `<div class="pagecard" onclick="openPage('${id}')"><h3>${E(p.icon)} ${E(p.name)}</h3><div class="muted">Bookmark ${Object.keys(p.bookmarks).length} · Record ${Object.keys(p.records).length}</div></div>`}).join('')}</div>`;return}const p=page(),t=curt();c.innerHTML=`<div class="head"><div><h1>${E(p.icon)} ${E(p.name)}</h1><div class="muted">${E(p.description)}</div></div><div class="actions"><button onclick="pageSettings()">Page Settings</button></div></div><div class="tabs">${p.tabOrder.map(id=>{const x=p.tabs[id];return `<button class="tab ${id===rt.tabId?'on':''}" onclick="openTab('${id}')">${E(x.name)}</button>`}).join('')}</div>${t?tabView(t):'<div class="empty">Tab이 없습니다.</div>'}`}
function openTab(id){rt.tabId=id;rt.search='';rt.selected.clear();body()}
function entities(t){const p=page();return t.type==='bookmark'?Object.values(p.bookmarks):t.type==='record'?Object.values(p.records):t.type==='tag'?Object.values(p.tags):Object.values(p.categories)}
function titleOf(t,e){const p=page();if(t.type==='tag'||t.type==='category')return e.name;const s=p.schemas[t.schemaId],first=s?.fieldOrder?.[0],q=s?.fields[first]?.placementOrder?.[0],iid=s?.fields[first]?.placements[q]?.inputId;return e.values?.[iid]||e.id}
function filtered(t){let a=entities(t);const q=rt.search.trim().toLowerCase();if(q)a=a.filter(e=>JSON.stringify(e).toLowerCase().includes(q)||String(titleOf(t,e)).toLowerCase().includes(q));return a.sort((a,b)=>String(titleOf(t,a)).localeCompare(String(titleOf(t,b))))}
function tabView(t){const a=filtered(t);let add=t.type==='bookmark'?'＋ Bookmark':t.type==='record'?'＋ Record':t.type==='tag'?'＋ Tag':'＋ Category';return `<div class="toolbar"><input placeholder="검색" value="${E(rt.search)}" oninput="rt.search=this.value;body()"><button class="primary" onclick="addEntity()">${add}</button>${t.type==='bookmark'?'<button onclick="folderModal()">Folder</button>':''}${t.type==='record'?'<button onclick="groupModal()">Auto Folder</button>':''}<button onclick="toggleSelect()">${rt.select?'선택 종료':'선택'}</button><button onclick="schemaModal()" ${!['bookmark','record'].includes(t.type)?'disabled':''}>Field / Input</button><button onclick="tabSettings()">Tab Settings</button></div>${rt.select?`<div class="selectbar"><b>${rt.selected.size}개 선택</b><button onclick="selectAll()">전체 선택</button><button class="danger" onclick="bulkDelete()">삭제</button></div>`:''}${renderEntities(t,a)}`}
function renderEntities(t,a){if(!a.length)return '<div class="empty">표시할 항목이 없습니다.</div>';if(t.type==='bookmark'){const p=page(),groups=new Map();for(const e of a){const k=e.folderId||'';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)}let out='';for(const [fid,items] of groups){const name=fid?p.folders[fid]?.name||'Folder':'Unfiled';out+=`<div class="folder"><div class="folderhead"><b>${E(name)}</b><span class="muted">${items.length}개</span></div><div class="folderbody ${curt().layout.mode==='list'?'list':'grid'}">${items.map(e=>card(t,e)).join('')}</div></div>`}return out}if(t.type==='record'&&t.grouping?.mode==='input'&&t.grouping.inputId){const groups=new Map();for(const e of a){let v=e.values?.[t.grouping.inputId];let vals=Array.isArray(v)?v:[v??''];for(const k of vals){if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)}}return [...groups].map(([k,v])=>`<div class="folder"><b>${E(displayValue(page().inputs[t.grouping.inputId],k)||'값 없음')}</b><div class="folderbody grid">${v.map(e=>card(t,e)).join('')}</div></div>`).join('')}return `<div class="${t.layout.mode==='list'?'list':'grid'}">${a.map(e=>card(t,e)).join('')}</div>`}
function displayValue(inp,v){if(v==null)return '';const p=page();if(inp?.type==='relation'){const m={tag:p.tags,record:p.records,bookmark:p.bookmarks,category:p.categories,folder:p.folders}[inp.target]||{};if(Array.isArray(v))return v.map(x=>m[x]?.name||m[x]?.values?.[Object.keys(m[x]?.values||{})[0]]||x).join(', ');return m[v]?.name||v}return Array.isArray(v)?v.join(', '):String(v)}
function card(t,e){if(t.type==='tag'||t.type==='category')return `<div class="card ${rt.selected.has(e.id)?'sel':''}" onclick="${rt.select?`pick('${e.id}')`:`editSimple('${e.id}')`}"><h3>${E(e.name)}</h3><div class="muted">${E(e.id)}</div></div>`;const p=page(),s=p.schemas[t.schemaId];let fs='';for(const gid of s.fieldOrder){const f=s.fields[gid];for(const qid of f.placementOrder){const pl=f.placements[qid],inp=p.inputs[pl.inputId],v=e.values?.[pl.inputId];if(v===undefined)continue;fs+=`<div class="field"><div class="fname">${E(pl.alias||f.name||inp.name)}</div>${E(displayValue(inp,v))}</div>`}}return `<div class="card ${rt.selected.has(e.id)?'sel':''}" onclick="${rt.select?`pick('${e.id}')`:`editEntity('${e.id}')`}"><h3>${E(titleOf(t,e))}</h3>${fs}<div class="muted">${E(e.id)}</div></div>`}
function toggleSelect(){rt.select=!rt.select;rt.selected.clear();body()}function pick(id){rt.selected.has(id)?rt.selected.delete(id):rt.selected.add(id);body()}function selectAll(){filtered(curt()).forEach(e=>rt.selected.add(e.id));body()}
function modal(title,html,foot=''){document.body.insertAdjacentHTML('beforeend',`<div class="modalback" id="modal"><div class="modal"><h2>${title}</h2>${html}<div class="foot">${foot||'<button onclick="closeModal()">닫기</button>'}</div></div></div>`)}function closeModal(){document.getElementById('modal')?.remove()}function toast(s){let d=document.createElement('div');d.textContent=s;Object.assign(d.style,{position:'fixed',bottom:'20px',left:'50%',transform:'translateX(-50%)',background:'#111827',color:'#fff',padding:'10px 14px',borderRadius:'9px',zIndex:999});document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function addEntity(){const t=curt();if(t.type==='tag'||t.type==='category')return editSimple(null);editEntity(null)}
function editEntity(id){const t=curt(),p=page(),col=t.type==='bookmark'?p.bookmarks:p.records,e=id?col[id]:{id:null,values:{}};const s=p.schemas[t.schemaId];let html='<div class="form">';for(const gid of s.fieldOrder){const f=s.fields[gid];for(const qid of f.placementOrder){const pl=f.placements[qid],inp=p.inputs[pl.inputId],v=e.values?.[inp.id];html+=editor(inp,v)}}if(t.type==='bookmark')html+=`<label>Folder<select id="folderId"><option value="">Unfiled</option>${Object.values(p.folders).map(f=>`<option value="${f.id}" ${e.folderId===f.id?'selected':''}>${E(f.name)}</option>`).join('')}</select></label>`;html+='</div>';modal(id?'편집':'새 '+(t.type==='bookmark'?'Bookmark':'Record'),html,`<button onclick="closeModal()">취소</button>${id?`<button class="danger" onclick="deleteOne('${id}')">삭제</button>`:''}<button class="primary" onclick="saveEntity('${id||''}')">저장</button>`)}
function editor(inp,v){if(inp.type==='relation'){const p=page(),m={tag:p.tags,record:p.records,bookmark:p.bookmarks,category:p.categories,folder:p.folders}[inp.target]||{};const vals=Array.isArray(v)?v:(v?[v]:[]);return `<label>${E(inp.name)}<select data-i="${inp.id}" ${inp.multiple?'multiple':''}>${Object.values(m).map(x=>`<option value="${x.id}" ${vals.includes(x.id)?'selected':''}>${E(x.name||x.id)}</option>`).join('')}</select></label>`}return `<label>${E(inp.name)}${inp.type==='longtext'?`<textarea data-i="${inp.id}">${E(v||'')}</textarea>`:`<input data-i="${inp.id}" type="${inp.type==='number'?'number':inp.type==='date'?'date':inp.type==='datetime'?'datetime-local':'text'}" value="${E(v??'')}">`}</label>`}
function saveEntity(id){const t=curt(),p=page(),col=t.type==='bookmark'?p.bookmarks:p.records;tx(id?'Entity 편집':'Entity 생성',()=>{const e=id?col[id]:{id:alloc(p,t.type),values:{},createdAt:Date.now()};for(const el of document.querySelectorAll('[data-i]')){const inp=p.inputs[el.dataset.i];let v;if(el.tagName==='SELECT')v=inp.multiple?[...el.selectedOptions].map(o=>o.value):el.value;else v=el.value;if(inp.type==='number'&&v!=='')v=Number(v);if(v===''||(Array.isArray(v)&&!v.length))delete e.values[inp.id];else e.values[inp.id]=v}if(t.type==='bookmark'){const f=document.getElementById('folderId').value;if(f)e.folderId=f;else delete e.folderId}e.updatedAt=Date.now();if(!id)col[e.id]=e});closeModal()}
function deleteOne(id){const t=curt(),p=page();tx('Entity 삭제',()=>{delete (t.type==='bookmark'?p.bookmarks:p.records)[id];for(const x of [...Object.values(p.bookmarks),...Object.values(p.records)])for(const [iid,v] of Object.entries(x.values||{})){const inp=p.inputs[iid];if(inp?.type==='relation'&&inp.target===t.type){if(Array.isArray(v)){x.values[iid]=v.filter(z=>z!==id);if(!x.values[iid].length)delete x.values[iid]}else if(v===id)delete x.values[iid]}}});closeModal()}
function bulkDelete(){const ids=[...rt.selected];if(!ids.length)return;modal('선택 항목 삭제',`<div class="notice">${ids.length}개 항목을 삭제합니다.</div>`,`<button onclick="closeModal()">취소</button><button class="danger" onclick="confirmBulkDelete()">삭제</button>`)}function confirmBulkDelete(){const t=curt(),p=page();tx('Bulk 삭제',()=>{const col=t.type==='bookmark'?p.bookmarks:t.type==='record'?p.records:t.type==='tag'?p.tags:p.categories;for(const id of rt.selected)delete col[id]});rt.selected.clear();closeModal()}
function editSimple(id){const t=curt(),p=page(),col=t.type==='tag'?p.tags:p.categories,x=id?col[id]:null;modal(id?'편집':'새 '+(t.type==='tag'?'Tag':'Category'),`<div class="form"><label>이름<input id="simpleName" value="${E(x?.name||'')}"></label>${t.type==='category'?`<label>상위 Category<select id="parent"><option value="">없음</option>${Object.values(p.categories).filter(c=>c.id!==id).map(c=>`<option value="${c.id}" ${x?.parentId===c.id?'selected':''}>${E(c.name)}</option>`).join('')}</select></label>`:''}</div>`,`<button onclick="closeModal()">취소</button>${id?`<button class="danger" onclick="deleteSimple('${id}')">삭제</button>`:''}<button class="primary" onclick="saveSimple('${id||''}')">저장</button>`)}
function saveSimple(id){const t=curt(),p=page(),col=t.type==='tag'?p.tags:p.categories,name=document.getElementById('simpleName').value.trim();if(!name)return toast('이름을 입력하세요.');tx('분류 정보 저장',()=>{const x=id?col[id]:{id:alloc(p,t.type==='tag'?'tag':'category')};x.name=name;if(t.type==='category'){const par=document.getElementById('parent').value;if(par)x.parentId=par;else delete x.parentId}col[x.id]=x});closeModal()}function deleteSimple(id){const t=curt(),p=page();tx('분류 정보 삭제',()=>{delete (t.type==='tag'?p.tags:p.categories)[id]});closeModal()}
function folderModal(){const p=page();modal('Folder 관리',`<div class="form"><div class="row"><input id="newFolder" placeholder="새 Folder 이름"><button onclick="createFolder()">생성</button></div>${Object.values(p.folders).map(f=>`<div class="row"><b>${E(f.name)}</b><span class="muted">${f.id}</span><button class="danger" onclick="delFolder('${f.id}')">삭제</button></div>`).join('')}</div>`)}function createFolder(){const n=document.getElementById('newFolder').value.trim();if(!n)return;tx('Folder 생성',()=>{const p=page(),id=alloc(p,'folder');p.folders[id]={id,name:n}});closeModal()}function delFolder(id){tx('Folder 삭제',()=>{const p=page();delete p.folders[id];for(const b of Object.values(p.bookmarks))if(b.folderId===id)delete b.folderId});closeModal()}
function groupModal(){const p=page(),t=curt(),s=p.schemas[t.schemaId],ids=[...new Set(s.fieldOrder.flatMap(g=>s.fields[g].placementOrder.map(q=>s.fields[g].placements[q].inputId)))];modal('Auto Folder',`<div class="form"><label>Group by<select id="groupI"><option value="">사용 안 함</option>${ids.map(i=>`<option value="${i}" ${t.grouping?.inputId===i?'selected':''}>${E(p.inputs[i].name)}</option>`).join('')}</select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveGroup()">저장</button>`)}function saveGroup(){const i=document.getElementById('groupI').value;tx('Grouping 변경',()=>{curt().grouping=i?{mode:'input',inputId:i}:{mode:'none'}});closeModal()}
function schemaModal(){const p=page(),t=curt(),s=p.schemas[t.schemaId];modal('Field / Input',`<div class="notice">v4에서는 Input이 실제 값을 저장하고 Field는 표시 영역입니다. Field 삭제는 실제 값을 삭제하지 않습니다.</div><div class="form" style="margin-top:10px">${s.fieldOrder.map(g=>{const f=s.fields[g],q=f.placements[f.placementOrder[0]],i=p.inputs[q.inputId];return `<div class="row"><input data-g="${g}" value="${E(f.name)}"><span>${E(i.name)} · ${E(i.type)}</span><button class="danger" onclick="removeField('${g}')">Field 삭제</button></div>`}).join('')}<button onclick="addFieldUI()">＋ 새 Input + Field</button></div>`,`<button onclick="closeModal()">닫기</button><button class="primary" onclick="saveFieldNames()">이름 저장</button>`)}function saveFieldNames(){tx('Field 이름 변경',()=>{for(const el of document.querySelectorAll('[data-g]'))page().schemas[curt().schemaId].fields[el.dataset.g].name=el.value.trim()||'Field'});closeModal()}function removeField(g){tx('Field 삭제',()=>{const s=page().schemas[curt().schemaId];delete s.fields[g];s.fieldOrder=s.fieldOrder.filter(x=>x!==g)});closeModal()}function addFieldUI(){closeModal();modal('새 Input + Field',`<div class="form"><label>Input 이름<input id="inName"></label><label>종류<select id="inType"><option value="text">Text</option><option value="longtext">Long text</option><option value="number">Number</option><option value="url">URL</option><option value="date">Date</option></select></label><label>Field 이름<input id="fieldName"></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="createInputField()">생성</button>`)}function createInputField(){const p=page(),n=document.getElementById('inName').value.trim()||'Input',fn=document.getElementById('fieldName').value.trim()||n,type=document.getElementById('inType').value;tx('Input/Field 생성',()=>{const iid=input(p,n,type),s=p.schemas[curt().schemaId],gid=alloc(p,'field'),qid=alloc(p,'placement');s.fieldOrder.push(gid);s.fields[gid]={id:gid,name:fn,placementOrder:[qid],placements:{[qid]:{id:qid,inputId:iid}}}});closeModal()}
function tabSettings(){const t=curt();modal('Tab Settings',`<div class="form"><label>이름<input id="tabName" value="${E(t.name)}"></label><label>Layout<select id="layout"><option value="grid" ${t.layout.mode==='grid'?'selected':''}>Grid</option><option value="list" ${t.layout.mode==='list'?'selected':''}>List</option></select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveTabSettings()">저장</button>`)}function saveTabSettings(){tx('Tab 설정',()=>{curt().name=document.getElementById('tabName').value.trim()||curt().name;curt().layout.mode=document.getElementById('layout').value});closeModal()}
function pageSettings(){const p=page();modal('Page Settings',`<div class="form"><label>이름<input id="pname" value="${E(p.name)}"></label><label>설명<textarea id="pdesc">${E(p.description)}</textarea></label><div class="notice">Tab 생성은 Page Settings에서 관리합니다.</div><label>새 Tab 종류<select id="newTabType"><option value="bookmark">Bookmark</option><option value="record">Record</option><option value="tag">Tag</option><option value="category">Category</option></select></label><button onclick="createTab()">＋ Tab 생성</button><button onclick="duplicatePage()">Page 복제</button></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="savePageSettings()">저장</button>`)}function savePageSettings(){tx('Page 설정',()=>{page().name=document.getElementById('pname').value.trim()||page().name;page().description=document.getElementById('pdesc').value});closeModal()}function createTab(){const type=document.getElementById('newTabType').value,p=page();tx('Tab 생성',()=>{let sid=null;if(type==='bookmark'||type==='record'){const base=Object.values(p.schemas).find(s=>s.entityType===type);sid=cloneSchema(p,base)}tab(p,type==='record'?'Record':type==='bookmark'?'북마크':type==='tag'?'태그':'카테고리',type,sid)});closeModal()}function cloneSchema(p,src){const sid=alloc(p,'schema'),s={id:sid,entityType:src.entityType,fieldOrder:[],fields:{},inputDisplay:C(src.inputDisplay||{})};for(const og of src.fieldOrder){const of=src.fields[og],ng=alloc(p,'field'),nf={id:ng,name:of.name,placementOrder:[],placements:{}};for(const oq of of.placementOrder){const op=of.placements[oq],nq=alloc(p,'placement');nf.placementOrder.push(nq);nf.placements[nq]={...C(op),id:nq}}s.fieldOrder.push(ng);s.fields[ng]=nf}p.schemas[sid]=s;return sid}
function newPage(){modal('새 Page','<div class="form"><label>이름<input id="npname" value="새 Page"></label></div>','<button onclick="closeModal()">취소</button><button class="primary" onclick="createPageNow()">생성</button>')}function createPageNow(){tx('Page 생성',()=>{const p=makePage(document.getElementById('npname').value.trim()||'새 Page');p.id=alloc(db,'page');db.pages[p.id]=p;db.main.pageOrder.push(p.id);rt.pageId=p.id;rt.tabId=p.tabOrder[0]});closeModal()}function duplicatePage(){const old=page();tx('Page 복제',()=>{const n=C(old),id=alloc(db,'page');n.id=id;n.name=old.name+' Copy';db.pages[id]=n;db.main.pageOrder.push(id);rt.pageId=id;rt.tabId=n.tabOrder[0]});closeModal()}
function systemModal(){modal('DB 관리',`<div class="form"><button onclick="exportDB()">Export</button><button onclick="importDB()">Import / 전체 교체</button><button onclick="dbCheck()">DB Check</button><button onclick="makeBackup()">Backup 다운로드</button><div class="notice">Import는 v4 Format 1만 지원합니다. v1/v2/v3 자동 변환은 포함하지 않습니다.</div></div>`)}function download(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportDB(){download(`tagmark-v4-${Date.now()}.json`,db)}function makeBackup(){download(`tagmark-backup-${Date.now()}.json`,db)}function dbCheck(){const x=validate(db);modal('DB Check',x.length?`<div class="notice">${x.map(E).join('<br>')}</div>`:'<div class="notice">검사 완료: 발견된 구조 오류가 없습니다.</div>')}
function importDB(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const x=JSON.parse(await i.files[0].text()),issues=validate(x);if(issues.length)throw Error(issues[0]);download(`tagmark-emergency-${Date.now()}.json`,db);db=x;rt.pageId=db.main.pageOrder[0]||null;rt.tabId=rt.pageId?db.pages[rt.pageId].tabOrder[0]:null;rt.undo=[];rt.redo=[];await persist();closeModal();render();toast('Import 완료')}catch(e){toast('Import 실패: '+e.message)}};i.click()}
load().catch(e=>{document.getElementById('app').innerHTML='<div class="empty">시작 실패: '+E(e.message)+'</div>'});
</script></body></html>
