function renderBody(){const c=document.getElementById('content');if(!c)return;if(!rt.pageId){let ids=[...db.main.pageOrder].filter(id=>db.pages[id]);const q=String(rt.mainSearch||'').trim().toLowerCase();if(q)ids=ids.filter(id=>{const p=db.pages[id];return `${p.name||''} ${p.description||''}`.toLowerCase().includes(q)});ids.sort((a,b)=>{const d=String(db.pages[a].name).localeCompare(String(db.pages[b].name),undefined,{numeric:true});return db.main.sort==='desc'?-d:d});c.innerHTML=`<div class="main-hero"><div><h1>Main</h1><div class="muted">Page를 선택해 독립된 데이터 공간으로 들어갑니다.</div><div class="main-count">${ids.length} / ${db.main.pageOrder.length} Pages</div></div><div class="actions"><button class="primary" onclick="newPage()">새 Page</button></div></div><div class="main-toolbar"><input id="mainSearch" class="main-search" value="${E(rt.mainSearch||'')}" oninput="setMainSearch(this.value)" placeholder="Page 검색"><button onclick="toggleMainLayout()">${db.main.layout==='list'?'목록':'그리드'}</button><button onclick="toggleMainSort()">${db.main.sort==='desc'?'Z→A':'A→Z'}</button><button class="primary" onclick="newPage()">새 Page</button></div><div class="main-pages ${db.main.layout==='list'?'list':''}">${ids.map(id=>{const p=db.pages[id];return `<article class="pagecard" onclick="openPage('${id}')"><div class="pagecard-main"><div class="pagecard-title"><h3>${E(p.name)}</h3>${p.systemTestPage?'<span class="testbadge">TEST</span>':''}</div><div class="pagecard-desc">${E(p.description||'설명 없음')}</div><div class="pagecard-actions"><button onclick="event.stopPropagation();openPage('${id}')">열기</button><button onclick="event.stopPropagation();duplicatePageFromMain('${id}')">복제</button></div></div><div class="pagecard-stats"><div class="pagecard-stat"><b>${Object.keys(p.bookmarks).length}</b><span>Bookmark</span></div><div class="pagecard-stat"><b>${Object.keys(p.records).length}</b><span>Record</span></div><div class="pagecard-stat"><b>${Object.keys(p.tags).length}</b><span>Tag</span></div><div class="pagecard-stat"><b>${Object.keys(p.categories).length}</b><span>Category</span></div></div></article>`}).join('')||'<div class="empty">조건에 맞는 Page가 없습니다.</div>'}</div>`;return}const p=page(),t=curt();c.innerHTML=`<section class="page-shell-head"><div class="page-shell-title"><div style="min-width:0"><h1>${E(p.name)}</h1><div class="muted page-shell-desc">${E(p.description||'설명 없음')}</div></div></div><div class="actions"><button onclick="pageSettings()">Page Settings</button></div></section><div class="tabs shell-tabs">${p.tabOrder.map(id=>{const x=p.tabs[id];return `<button class="tab ${id===rt.tabId?'on':''}" onclick="openTab('${id}')">${E(x.name)}</button>`}).join('')}<button class="tab tab-add" title="새 탭" aria-label="새 탭" onclick="newTabModal()">＋</button></div>${t?tabView(t):'<div class="empty">탭이 없습니다.</div>'}`}

function titleOf(t,e){const p=page();if(t.type==='tag'||t.type==='category')return e.name;const s=p.schemas[t.schemaId];if(t.type==='record'&&s){for(const gid of s.fieldOrder||[]){const f=s.fields?.[gid];for(const qid of f?.placementOrder||[]){const pl=f.placements?.[qid],iid=pl?.inputId;if(pl?.card?.format==='title'&&iid&&e.values?.[iid]!==undefined&&e.values[iid]!=='' )return e.values[iid]}}const iid=t.recordPresentation?.nameInputId;if(iid&&p.inputs[iid]&&e.values?.[iid]!==undefined&&e.values[iid]!=='' )return e.values[iid]}if(t.type==='bookmark'&&s){for(const gid of s.fieldOrder||[]){const f=s.fields?.[gid];for(const qid of f?.placementOrder||[]){const pl=f.placements?.[qid],iid=pl?.inputId;if(pl?.card?.format==='title'&&iid&&e.values?.[iid]!==undefined&&e.values[iid]!=='' )return e.values[iid]}}}if(s){for(const gid of s.fieldOrder||[]){const f=s.fields?.[gid];for(const qid of f?.placementOrder||[]){const iid=f.placements?.[qid]?.inputId,inp=p.inputs?.[iid],v=e.values?.[iid];if(!inp||v===undefined||v==='')continue;if(inp.type!=='relation')return displayValue(inp,v)}}for(const gid of s.fieldOrder||[]){const f=s.fields?.[gid];for(const qid of f?.placementOrder||[]){const iid=f.placements?.[qid]?.inputId,inp=p.inputs?.[iid],v=e.values?.[iid];if(!inp||v===undefined||v==='')continue;return displayValue(inp,v)}}}return e.id}

function displayValue(inp,v){if(v==null)return '';if(inp?.type==='duration'){const n=Math.max(0,Number(v)||0),h=Math.floor(n/3600),m=Math.floor((n%3600)/60),s=Math.floor(n%60);return [h,m,s].map((x,i)=>i?String(x).padStart(2,'0'):String(x)).join(':')}if(inp?.type==='boolean'){if(v===true||v==='true'||v===1||v==='1')return '예';if(v===false||v==='false'||v===0||v==='0')return '아니오';return ''}if(inp?.type==='relation'){if(Array.isArray(v))return v.map(x=>relationValueLabel(inp.target,x)).join(', ');return relationValueLabel(inp.target,v)}return Array.isArray(v)?v.join(', '):String(v)}

function modal(title,html,foot='',opts={}){document.getElementById('modal')?.remove();const size=opts.size==='wide'?' modal-wide':opts.size==='narrow'?' modal-narrow':'';document.body.insertAdjacentHTML('beforeend',`<div class="modalback" id="modal"><section class="modal${size}" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><h2 id="modalTitle">${title}</h2><button class="modalclose" type="button" aria-label="닫기" onclick="closeModal()">×</button></div><div class="modalbody">${html}</div><div class="modalfoot foot">${foot||'<button onclick="closeModal()">닫기</button>'}</div></section></div>`)}function closeModal(){document.getElementById('modal')?.remove()}function toast(s){let d=document.createElement('div');d.textContent=s;Object.assign(d.style,{position:'fixed',bottom:'20px',left:'50%',transform:'translateX(-50%)',background:'#111827',color:'#fff',padding:'10px 14px',borderRadius:'9px',zIndex:999});document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}

function durationParts(sec){const n=Math.max(0,Number(sec)||0);return [Math.floor(n/3600),Math.floor((n%3600)/60),Math.floor(n%60)]}
function syncDuration(iid){const h=Number(document.querySelector(`[data-dur-h="${iid}"]`)?.value)||0,m=Number(document.querySelector(`[data-dur-m="${iid}"]`)?.value)||0,se=Number(document.querySelector(`[data-dur-s="${iid}"]`)?.value)||0,hidden=document.querySelector(`[data-dur-hidden="${iid}"]`);if(hidden)hidden.value=Math.max(0,h*3600+m*60+se)||''}
function durationEditor(inp,v,compact=false){const [h,m,se]=durationParts(v);return `${compact?'':`<label>${E(inp.name)}</label>`}<div class="durrow"><input type="number" min="0" data-dur-h="${inp.id}" value="${h}" oninput="syncDuration('${inp.id}')"><span>:</span><input type="number" min="0" max="59" data-dur-m="${inp.id}" value="${m}" oninput="syncDuration('${inp.id}')"><span>:</span><input type="number" min="0" max="59" data-dur-s="${inp.id}" value="${se}" oninput="syncDuration('${inp.id}')"></div><input type="hidden" data-i="${inp.id}" data-dur-hidden="${inp.id}" value="${v?Number(v):''}">`}
function metaModeChanged(pageId,durId){const mode=document.querySelector('input[name="legacyMetaMode"]:checked')?.value||'';const p=document.getElementById('legacyPagesWrap'),d=document.getElementById('legacyDurationWrap'),pi=document.querySelector(`[data-i="${pageId}"]`),di=document.querySelector(`[data-i="${durId}"]`);if(p)p.style.display=mode==='pages'?'block':'none';if(d)d.style.display=mode==='duration'?'block':'none';if(mode!=='pages'&&pi)pi.value='';if(mode!=='duration'&&di)di.value=''}
function legacyMetaEditor(pageInp,durInp,e){const pv=e.values?.[pageInp.id],dv=e.values?.[durInp.id],mode=pv!==undefined?'pages':dv!==undefined?'duration':'';return `<div class="meta-composite"><div class="fname">${E(pageInp.name)} / ${E(durInp.name)}</div><div class="meta-radios"><label><input type="radio" name="legacyMetaMode" value="" ${!mode?'checked':''} onchange="metaModeChanged('${pageInp.id}','${durInp.id}')"> 없음</label><label><input type="radio" name="legacyMetaMode" value="pages" ${mode==='pages'?'checked':''} onchange="metaModeChanged('${pageInp.id}','${durInp.id}')"> ${E(pageInp.name)}</label><label><input type="radio" name="legacyMetaMode" value="duration" ${mode==='duration'?'checked':''} onchange="metaModeChanged('${pageInp.id}','${durInp.id}')"> ${E(durInp.name)}</label></div><div id="legacyPagesWrap" style="display:${mode==='pages'?'block':'none'}"><input data-i="${pageInp.id}" type="number" min="1" step="1" value="${E(pv??'')}" placeholder="${E(pageInp.name)}"></div><div id="legacyDurationWrap" style="display:${mode==='duration'?'block':'none'}">${durationEditor(durInp,dv,true)}</div></div>`}
function nativeRelationSelect(inp,v){const vals=Array.isArray(v)?v:(v?[v]:[]),opts=Object.values(relationMap(inp.target)).sort((a,b)=>relationLabel(inp.target,a).localeCompare(relationLabel(inp.target,b),undefined,{numeric:true}));return `<label>${E(inp.name)}<select data-i="${inp.id}" ${inp.multiple?'multiple size="7"':''}>${!inp.multiple?'<option value="">선택 없음</option>':''}${opts.map(x=>`<option value="${x.id}" ${vals.includes(x.id)?'selected':''}>${E(relationLabel(inp.target,x))}</option>`).join('')}</select></label>`}

function informationKind(inp){if(inp?.type==='relation')return'Relation';if(['date','datetime'].includes(inp?.type))return'Date & Time';if(['number','duration'].includes(inp?.type))return'Number';if(['text','longtext','url'].includes(inp?.type))return'Text';if(inp?.type==='boolean')return'Boolean';if(inp?.type==='choice')return'Choice';return'Value'}
function informationTypeLabel(inp){const k=informationKind(inp);if(k==='Relation'){const m={tag:'Tag',record:'Record',category:'Category',bookmark:'Bookmark',folder:'Folder'};return `Relation · ${m[inp?.target]||inp?.target||'대상'}`}if(k==='Text'){if(inp?.type==='url')return'Text · URL';if(inp?.type==='longtext')return'Text · 여러 줄';return'Text'}if(k==='Number')return inp?.type==='duration'?'Number · 시간 길이':'Number';if(k==='Date & Time')return inp?.type==='datetime'?'Date & Time · 날짜 + 시간':'Date & Time · 날짜';return k}
function infoKeyFromInput(inp){if(inp?.type==='relation')return `relation:${inp.target||'unknown'}`;return inp?.type||'text'}
function infoLabelFromKey(k){const m={text:'Text',longtext:'Text · 여러 줄',url:'Text · URL',number:'Number',duration:'Number · 시간 길이',date:'Date & Time · 날짜',datetime:'Date & Time · 날짜 + 시간',boolean:'Boolean',choice:'Choice','relation:tag':'Relation · Tag','relation:record':'Relation · Record','relation:category':'Relation · Category','relation:bookmark':'Relation · Bookmark','relation:folder':'Relation · Folder'};return m[k]||k}
function infoOptionMarkup(current='text'){const groups=[['Text',[['text','한 줄 텍스트'],['longtext','여러 줄 텍스트'],['url','URL']]],['Number',[['number','숫자'],['duration','시간 길이 (시:분:초)']]],['Date & Time',[['date','날짜'],['datetime','날짜 + 시간']]],['Boolean',[['boolean','예 / 아니오']]],['Choice',[['choice','미리 정한 선택지']]],['Relation',[['relation:tag','Tag 연결'],['relation:record','Record 연결'],['relation:category','Category 연결']]]];let found=false,out='';for(const [group,items] of groups){out+=`<optgroup label="${E(group)}">`;for(const [k,n] of items){if(k===current)found=true;out+=`<option value="${E(k)}" ${current===k?'selected':''}>${E(n)}</option>`}out+='</optgroup>'}if(current&&!found)out+=`<option value="${E(current)}" selected>${E(infoLabelFromKey(current))} (기존 형식)</option>`;return out}
function infoSpecFromKey(key,base={}){if(String(key).startsWith('relation:')){const target=String(key).split(':')[1]||'tag';return{type:'relation',target,multiple:base.type==='relation'?!!base.multiple:true}}return{type:key||'text',target:null,multiple:key==='choice'?!!base.multiple:false,choices:key==='choice'?(Array.isArray(base.choices)?base.choices:[]):[]}}
function tempInputFromInfoKey(key,base={}){const spec=infoSpecFromKey(key,base),x={...base,type:spec.type};if(spec.target)x.target=spec.target;else delete x.target;x.multiple=!!spec.multiple;if(spec.type==='choice')x.choices=spec.choices;return x}
function applyInfoKey(inp,key){const spec=infoSpecFromKey(key,inp);inp.type=spec.type;if(spec.target)inp.target=spec.target;else delete inp.target;if(spec.type==='relation'||spec.type==='choice')inp.multiple=!!spec.multiple;else delete inp.multiple;if(spec.type==='choice'){if(!Array.isArray(inp.choices))inp.choices=[]}else delete inp.choices}
function compactInfoKey(inp,pl){if(inp?.type==='choice'){const m=normalizedEditorMethod(inp,pl);return `choice:${['radio','cycle','checkboxes'].includes(m)?(m==='checkboxes'?'checkbox':m):'dropdown'}`}return infoKeyFromInput(inp)}
function compactInfoOptions(inp,pl){const current=compactInfoKey(inp,pl),baseKey=infoKeyFromInput(inp),groups=[['Text',[['text','한 줄 텍스트'],['longtext','여러 줄 텍스트'],['url','URL']]],['Number',[['number','숫자'],['duration','시간 길이 (시:분:초)']]],['Date & Time',[['date','날짜'],['datetime','날짜 + 시간']]],['Boolean',[['boolean','예 / 아니오']]],['Choice',[['choice:dropdown','드롭다운'],['choice:radio','라디오 버튼'],['choice:checkbox','체크박스 (복수 선택)'],['choice:cycle','순환 버튼']]],['Relation',[['relation:tag','Tag 검색/선택'],['relation:record','Record 검색/선택'],['relation:category','Category 검색/선택']]]];let out='',found=false;for(const [group,items] of groups){out+=`<optgroup label="${E(group)}">`;for(const [k,n] of items){if(k===current)found=true;out+=`<option value="${E(k)}" ${current===k?'selected':''}>${E(n)}</option>`}out+='</optgroup>'}if(!found)out+=`<option value="${E(baseKey)}" selected>${E(informationTypeLabel(inp))} (기존 형식)</option>`;return out}
function applyCompactInfo(pl,inp,key){let base=key,method='auto';if(String(key).startsWith('choice:')){base='choice';const cm=String(key).split(':')[1]||'dropdown';method=cm==='checkbox'?'checkboxes':cm}else if(key==='text')method='input';else if(key==='longtext')method='textarea';else if(key==='url')method='input';else if(key==='number')method='number';else if(key==='duration')method='duration';else if(key==='date')method='date';else if(key==='datetime')method='datetime';else if(key==='boolean')method='checkbox';else if(String(key).startsWith('relation:'))method='searchPicker';applyInfoKey(inp,base);if(base==='choice')inp.multiple=String(key).endsWith(':checkbox');pl.editor={method}}
function schemaInfoChanged(iid,source){const key=source.value,base=page().inputs[iid];for(const el of document.querySelectorAll(`[data-info-format][data-input-id="${iid}"]`))if(el!==source)el.value=key;const pseudo=tempInputFromInfoKey(String(key).startsWith('choice:')?'choice':key,base);for(const row of document.querySelectorAll(`[data-placement-input="${iid}"]`)){const display=row.querySelector('[data-display-type]');if(display){const qid=display.dataset.displayType,pl=findPlacementById(qid),cur=display.value;display.innerHTML=displayTypeOptions(pl,pseudo);if([...display.options].some(o=>o.value===cur))display.value=cur}}}
function findPlacementById(qid){const s=page()?.schemas?.[curt()?.schemaId];if(!s)return null;for(const g of s.fieldOrder||[]){const pl=s.fields?.[g]?.placements?.[qid];if(pl)return pl}return null}
function inputInfoExtras(prefix){const key=document.getElementById(prefix+'Info')?.value||'text',rel=key.startsWith('relation:'),choice=key==='choice';const m=document.getElementById(prefix+'MultipleWrap'),c=document.getElementById(prefix+'ChoicesWrap');if(m)m.style.display=rel?'flex':'none';if(c)c.style.display=choice?'grid':'none'}

function inputMethodDefault(inp){if(inp?.type==='longtext')return'textarea';if(inp?.type==='number')return'number';if(inp?.type==='duration')return'duration';if(inp?.type==='date')return'date';if(inp?.type==='datetime')return'datetime';if(inp?.type==='boolean')return'checkbox';if(inp?.type==='choice')return inp.multiple?'checkboxes':'dropdown';if(inp?.type==='relation'&&inp.target==='tag')return'tagPicker';if(inp?.type==='relation'&&inp.target==='category')return'categoryPicker';if(inp?.type==='relation'&&inp.target==='record')return'recordPicker';if(inp?.type==='relation')return'searchPicker';return'input'}
function normalizedEditorMethod(inp,pl){const m=pl?.editor?.method||'auto';return m==='auto'?inputMethodDefault(inp):m}
function inputMethodOptions(inp,current='auto'){const add=(v,n)=>`<option value="${v}" ${current===v?'selected':''}>${n}</option>`,a=[['auto','자동']];if(inp.type==='text'||inp.type==='url')a.push(['input','한 줄 입력']);if(inp.type==='longtext')a.push(['textarea','여러 줄 입력'],['input','한 줄 입력']);if(inp.type==='number')a.push(['number','숫자 입력']);if(inp.type==='duration')a.push(['duration','Duration']);if(inp.type==='date')a.push(['date','날짜']);if(inp.type==='datetime')a.push(['datetime','날짜 + 시간']);if(inp.type==='boolean')a.push(['checkbox','Checkbox'],['radio','Radio'],['dropdown','Dropdown'],['cycle','Cycle']);if(inp.type==='choice')a.push(['dropdown','Dropdown'],['radio','Radio'],['checkboxes','Checkbox'],['cycle','Cycle']);if(inp.type==='relation'){a.push(['searchPicker','Search Picker']);if(inp.target==='tag')a.push(['tagPicker','Tag Picker']);if(inp.target==='category')a.push(['categoryPicker','Category Picker']);if(inp.target==='record')a.push(['recordPicker','Profile / Record Picker']);a.push(['dropdown','Dropdown']);if(inp.multiple)a.push(['checkboxes','Checkbox']);else a.push(['radio','Radio'])}return a.map(([v,n])=>add(v,n)).join('')}
function displayTypeOf(pl,inp){const f=pl?.card?.format||'auto';if(f==='title')return'title';if(f==='chips')return'tag';if(f==='notes')return'memo';if(f==='recordList')return'record';if(f==='hidden')return'hidden';return'item'}
function displayTypeOptions(pl,inp){const cur=displayTypeOf(pl,inp),opts=[['title','Title'],['item','Item']];if(inp?.type==='relation'||inp?.type==='choice')opts.push(['tag','Tag']);if(['text','longtext'].includes(inp?.type))opts.push(['memo','Memo']);if(inp?.type==='relation'&&inp.target==='record')opts.push(['record','Record']);if(cur==='hidden')opts.push(['hidden','표시 안 함 (기존 설정)']);if(!opts.some(x=>x[0]===cur)&&cur!=='profile')opts.splice(2,0,[cur,cur]);return opts.map(([v,n])=>`<option value="${v}" ${cur===v||(cur==='profile'&&v==='record')?'selected':''}>${n}</option>`).join('')}
function applyDisplayType(pl,v){pl.card=pl.card||{};if(v==='title'){pl.card.format='title';pl.card.label='hidden'}else if(v==='tag'){pl.card.format='chips';pl.card.label='hidden'}else if(v==='memo'){pl.card.format='notes';pl.card.label='hidden'}else if(v==='record'||v==='profile'){pl.card.format='recordList';pl.card.label='hidden'}else if(v==='hidden'){pl.card.format='hidden';pl.card.label='hidden'}else{pl.card.format='info';if(!pl.card.label||pl.card.label==='hidden')pl.card.label='inline'}}

function tagUsageMap(){const p=page(),out={};for(const id of Object.keys(p.tags||{}))out[id]=new Set();for(const [kind,col] of [['b',p.bookmarks||{}],['r',p.records||{}]])for(const e of Object.values(col))for(const [iid,v] of Object.entries(e.values||{})){const inp=p.inputs[iid];if(inp?.type!=='relation'||inp.target!=='tag')continue;for(const tid of (Array.isArray(v)?v:[v]))if(out[tid])out[tid].add(kind+':'+e.id)}return Object.fromEntries(Object.entries(out).map(([id,set])=>[id,set.size]))}

function bulkMoveTagsModal(){const p=page();if(!rt.selected.size)return toast('Tag를 선택하세요.');modal('선택 태그 그룹 이동',`<div class="form"><div class="notice">선택 ${rt.selected.size}개 Tag의 Head를 변경합니다.</div><label>이동할 태그 그룹<select id="bulkTagHead"><option value="">미지정</option>${p.tagHeadOrder.filter(id=>p.tagHeads[id]).map(id=>`<option value="${id}">${E(p.tagHeads[id].name)}</option>`).join('')}</select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="applyBulkTagHead()">이동</button>`)}
function applyBulkTagHead(){const hid=document.getElementById('bulkTagHead')?.value||'';tx('태그 그룹 일괄 이동',()=>{const p=page();for(const id of rt.selected)if(p.tags[id]){if(hid)p.tags[id].headId=hid;else delete p.tags[id].headId;p.tags[id].updatedAt=Date.now()}});closeModal()}
function bulkTagColorModal(){if(!rt.selected.size)return toast('Tag를 선택하세요.');modal('선택 Tag 색상 변경',`<div class="form"><div class="notice">선택 ${rt.selected.size}개의 실제 Tag 색상 정보를 일괄 변경합니다. 표시 모드가 「Head로 표시 통일」이어도 실제 색상 정보는 그대로 보존됩니다.</div><label>사용자 지정 색상<input id="bulkTagColor" type="color" value="#315efb"></label><div class="form-help"><b>Head 기본값 따라가기</b>: Tag 고유 색상을 제거합니다.<br><b>현재 Head 색으로 값 저장</b>: 각 Tag의 현재 Head 색상을 그 Tag의 고유 색상으로 복사합니다. 이후 Head 색이 바뀌어도 저장된 Tag 색은 유지됩니다.</div></div>`,`<button onclick="closeModal()">취소</button><button onclick="applyBulkTagColor('inherit')">Head 기본값 따라가기</button><button onclick="applyBulkTagColor('headSnapshot')">현재 Head 색으로 값 저장</button><button class="primary" onclick="applyBulkTagColor('custom')">지정 색상 적용</button>`,{size:'wide'})}
function applyBulkTagColor(mode){const color=document.getElementById('bulkTagColor')?.value||'#315efb';tx('Tag 색상 일괄 변경',()=>{const p=page();for(const id of rt.selected){const x=p.tags[id];if(!x)continue;if(mode==='inherit')delete x.color;else if(mode==='headSnapshot')x.color=tagHeadColor(x.headId);else x.color=color;x.updatedAt=Date.now()}});closeModal()}
function quickDeleteUnusedTag(id){const usage=tagUsageMap()[id]||0;if(usage)return toast('현재 사용 중인 Tag라 바로 삭제할 수 없습니다.');tx('미사용 Tag 삭제',()=>{delete page().tags[id];rt.selected.delete(id)});toast('미사용 Tag를 삭제했습니다.')}
function newTagHeadModal(){modal('새 태그 그룹',`<div class="form"><label>이름<input id="newTagHeadName"></label><label>색상<input id="newTagHeadColor" type="color" value="#64748b"></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="createTagHeadFromModal()">생성</button>`)}
function createTagHeadFromModal(){const n=document.getElementById('newTagHeadName')?.value.trim(),c=document.getElementById('newTagHeadColor')?.value||'#64748b';if(!n)return toast('이름을 입력하세요.');let hid;tx('태그 그룹 생성',()=>{const p=page();hid=alloc(p,'tagHead');p.tagHeads[hid]={id:hid,name:n,color:c};p.tagHeadOrder.push(hid)});closeModal()}
function editTagHeadModal(id){const h=page().tagHeads[id];if(!h)return;modal('태그 그룹 수정',`<div class="form"><label>이름<input id="editHeadName" value="${E(h.name)}"></label><label>색상<input id="editHeadColor" type="color" value="${E(h.color||'#64748b')}"></label></div>`,`<button class="danger" onclick="closeModal();deleteHeadFlow('${id}')">삭제</button><button onclick="closeModal()">취소</button><button class="primary" onclick="saveTagHeadEdit('${id}')">저장</button>`)}
function saveTagHeadEdit(id){const n=document.getElementById('editHeadName')?.value.trim(),c=document.getElementById('editHeadColor')?.value||'#64748b';if(!n)return toast('이름을 입력하세요.');tx('태그 그룹 수정',()=>{const h=page().tagHeads[id];if(h){h.name=n;h.color=c}});closeModal()}
function tagEditModal(id){const p=page(),x=p.tags[id];if(!x)return;const has=!!x.color;modal('Tag 수정',`<div class="form"><label>이름<input id="tagEditName" value="${E(x.name)}"></label><label>태그 그룹<select id="tagEditHead"><option value="" ${!x.headId?'selected':''}>미지정</option>${p.tagHeadOrder.filter(h=>p.tagHeads[h]).map(h=>`<option value="${h}" ${x.headId===h?'selected':''}>${E(p.tagHeads[h].name)}</option>`).join('')}</select></label><label class="check"><input id="tagOwnColor" type="checkbox" ${has?'checked':''} onchange="document.getElementById('tagEditColor').disabled=!this.checked"> Tag 고유 색상 사용</label><input id="tagEditColor" type="color" value="${E(x.color||tagHeadColor(x.headId))}" ${has?'':'disabled'}></div>`,`<button class="danger" onclick="deleteTagFromEdit('${id}')">삭제</button><button onclick="closeModal()">취소</button><button class="primary" onclick="saveTagEdit('${id}')">저장</button>`)}
function saveTagEdit(id){const n=document.getElementById('tagEditName')?.value.trim(),h=document.getElementById('tagEditHead')?.value||'',own=document.getElementById('tagOwnColor')?.checked,c=document.getElementById('tagEditColor')?.value;if(!n)return toast('이름을 입력하세요.');tx('Tag 수정',()=>{const x=page().tags[id];x.name=n;if(h)x.headId=h;else delete x.headId;if(own)x.color=c||'#64748b';else delete x.color;x.updatedAt=Date.now()});closeModal()}
function deleteTagFromEdit(id){tx('Tag 삭제',()=>{detachTagRefs([id]);delete page().tags[id];rt.selected.delete(id)});closeModal()}

function ensureCategoryTabConfig(t){if(!t||t.type!=='category')return false;let changed=false;if(!t.categoryUsageFilter){t.categoryUsageFilter='all';changed=true}if(!t.categorySort){t.categorySort={by:'name',direction:'asc'};changed=true}if(!t.categoryViewMode){t.categoryViewMode='tree';changed=true}return changed}
function categoryUsageMap(){const p=page(),out=Object.fromEntries(Object.keys(p.categories).map(id=>[id,0]));for(const e of [...Object.values(p.bookmarks||{}),...Object.values(p.records||{})]){const seen=new Set();for(const [iid,v] of Object.entries(e.values||{})){const inp=p.inputs[iid];if(inp?.type!=='relation'||inp.target!=='category')continue;for(const id of (Array.isArray(v)?v:[v]))if(p.categories[id])seen.add(id)}for(const id of seen)out[id]=(out[id]||0)+1}return out}
function categorySubtreeUsage(id,usage){const ids=categoryDescendants(id);let n=0;for(const x of ids)n+=usage[x]||0;return n}
function categoryChildren(id){return Object.values(page().categories).filter(c=>(c.parentId||null)===(id||null))}
function categoryHasChildren(id){return categoryChildren(id).length>0}
function categoryClosed(id){rt.collapsedCategories=rt.collapsedCategories||new Set();return rt.collapsedCategories.has(rt.pageId+'/'+id)}
function toggleCategoryNode(id){rt.collapsedCategories=rt.collapsedCategories||new Set();const k=rt.pageId+'/'+id;rt.collapsedCategories.has(k)?rt.collapsedCategories.delete(k):rt.collapsedCategories.add(k);renderBody()}
function setAllCategoryNodes(closed){rt.collapsedCategories=rt.collapsedCategories||new Set();const p=page();for(const id of Object.keys(p.categories)){const k=rt.pageId+'/'+id;if(closed)rt.collapsedCategories.add(k);else rt.collapsedCategories.delete(k)}renderBody()}
function setCategoryUsageFilter(v){tx('Category 표시 필터',()=>{curt().categoryUsageFilter=v})}
function setCategorySort(v){tx('Category 정렬',()=>{const t=curt();t.categorySort=t.categorySort||{by:'name',direction:'asc'};t.categorySort.by=v})}
function toggleCategorySortDir(){tx('Category 정렬 방향',()=>{const t=curt();t.categorySort=t.categorySort||{by:'name',direction:'asc'};t.categorySort.direction=t.categorySort.direction==='desc'?'asc':'desc'})}
function setCategoryViewMode(v){tx('Category 보기',()=>{curt().categoryViewMode=v})}
function categoryItems(t){ensureCategoryTabConfig(t);const p=page(),usage=categoryUsageMap(),q=rt.search.trim().toLowerCase();let items=Object.values(p.categories);if(q)items=items.filter(c=>categoryPathName(c.id).toLowerCase().includes(q));if(t.categoryUsageFilter==='used')items=items.filter(c=>(usage[c.id]||0)>0);if(t.categoryUsageFilter==='unused')items=items.filter(c=>(usage[c.id]||0)===0);const so=t.categorySort||{by:'name',direction:'asc'},dir=so.direction==='desc'?-1:1;items.sort((a,b)=>{let d=0;if(so.by==='usage')d=(usage[a.id]||0)-(usage[b.id]||0);else d=String(a.name).localeCompare(String(b.name),undefined,{numeric:true});return (d||String(a.name).localeCompare(String(b.name),undefined,{numeric:true}))*dir});return {items,usage}}
function categorySelect(id){if(!rt.select)rt.select=true;rt.selected.has(id)?rt.selected.delete(id):rt.selected.add(id);renderBody()}
function categoryAllowedSet(items){const p=page(),allowed=new Set();for(const c of items){let cur=c;while(cur&&!allowed.has(cur.id)){allowed.add(cur.id);cur=cur.parentId?p.categories[cur.parentId]:null}}return allowed}
function categorySiblingSort(arr,t,usage){const so=t.categorySort||{by:'name',direction:'asc'},dir=so.direction==='desc'?-1:1;return arr.sort((a,b)=>{let d=so.by==='usage'?(usage[a.id]||0)-(usage[b.id]||0):String(a.name).localeCompare(String(b.name),undefined,{numeric:true});return (d||String(a.name).localeCompare(String(b.name),undefined,{numeric:true}))*dir})}
function categoryTreeHtml(t,items,usage){const p=page(),allowed=categoryAllowedSet(items),searching=!!rt.search.trim(),renderLevel=(parent,depth)=>{const kids=categorySiblingSort(Object.values(p.categories).filter(c=>(c.parentId||null)===(parent||null)&&allowed.has(c.id)),t,usage);return kids.map(c=>{const children=Object.values(p.categories).filter(x=>x.parentId===c.id&&allowed.has(x.id)),closed=!searching&&categoryClosed(c.id),direct=usage[c.id]||0,sub=categorySubtreeUsage(c.id,usage),sel=rt.selected.has(c.id);return `<div class="category-node"><div class="category-row ${sel?'selected':''}" style="--depth:${depth}">${children.length?`<button class="category-toggle" onclick="toggleCategoryNode('${c.id}')">${closed?'▶':'▼'}</button>`:'<button class="category-toggle blank">▶</button>'}${rt.select?`<input class="category-check" type="checkbox" ${sel?'checked':''} onclick="categorySelect('${c.id}')">`:''}<div class="category-main" onclick="${rt.select?`categorySelect('${c.id}')`:`toggleCategoryNode('${c.id}')`}"><div class="category-name">${E(c.name)}</div>${depth?`<div class="category-path">${E(categoryPathName(c.id))}</div>`:''}</div><div class="category-metrics"><span class="category-metric">직접 ${direct}</span>${sub!==direct?`<span class="category-metric">하위 포함 ${sub}</span>`:''}<span class="category-metric">하위 ${categoryChildren(c.id).length}</span></div><div class="category-row-actions"><button title="하위 Category 추가" onclick="event.stopPropagation();quickChildCategory('${c.id}')" aria-label="추가">＋</button><button title="수정" onclick="event.stopPropagation();categoryEditModal('${c.id}')">수정</button></div></div>${closed?'':`<div class="category-children">${renderLevel(c.id,depth+1)}</div>`}</div>`}).join('')};return `<div class="category-tree">${renderLevel(null,0)||'<div class="empty">표시할 Category가 없습니다.</div>'}</div>`}
function categoryListHtml(t,items,usage){return `<div class="category-list"><div class="category-list-row head"><span></span><span>Category</span><span>경로</span><span>사용</span><span>하위</span><span></span></div>${items.map(c=>{const u=usage[c.id]||0;return `<div class="category-list-row ${u?'':'category-unused'}"><input type="checkbox" ${rt.selected.has(c.id)?'checked':''} onclick="categorySelect('${c.id}')"><b>${E(c.name)}</b><span data-col="path">${E(categoryPathName(c.id))}</span><span>${u}</span><span data-col="children">${categoryChildren(c.id).length}</span><span><button class="category-list-edit" onclick="categoryEditModal('${c.id}')">수정</button></span></div>`}).join('')||'<div class="empty">표시할 Category가 없습니다.</div>'}</div>`}
function selectAllCategoryResults(){categoryItems(curt()).items.forEach(c=>rt.selected.add(c.id));rt.select=true;renderBody()}
function selectedCategoryRoots(){const p=page(),sel=new Set([...rt.selected].filter(id=>p.categories[id]));return [...sel].filter(id=>{let x=p.categories[id]?.parentId;while(x){if(sel.has(x))return false;x=p.categories[x]?.parentId}return true})}
function categoryBulkBar(){const n=rt.selected.size;return `<div class="category-bulkbar selection-toolbar"><span class="count">${n}개 선택</span><button onclick="selectAllCategoryResults()">현재 목록 전체 선택</button><button onclick="clearSelection()">선택 해제</button><button onclick="bulkCategoryParentModal()">부모 변경</button><button class="danger" onclick="bulkCategoryDeleteModal()">삭제</button></div>`}
function categoryParentOptions(currentIds=[]){const p=page(),blocked=new Set();for(const id of currentIds)for(const d of categoryDescendants(id))blocked.add(d);return `<option value="">최상위</option>`+Object.values(p.categories).filter(c=>!blocked.has(c.id)).sort((a,b)=>categoryPathName(a.id).localeCompare(categoryPathName(b.id),undefined,{numeric:true})).map(c=>`<option value="${c.id}">${E(categoryPathName(c.id))}</option>`).join('')}
function categoryEditModal(id,parentPreset=null){const p=page(),x=id?p.categories[id]:null,par=x?.parentId||parentPreset||'';modal(id?'Category 수정':'새 Category',`<div class="form"><label>이름<input id="categoryName" value="${E(x?.name||'')}"></label><label>상위 Category<select id="categoryParent">${categoryParentOptions(id?[id]:[])}</select></label>${id?`<div class="category-parent-note">현재 경로: ${E(categoryPathName(id))}</div>`:''}</div>`,`<button onclick="closeModal()">취소</button>${id?`<button class="danger" onclick="categoryDeleteModal('${id}')">삭제</button>`:''}<button class="primary" onclick="saveCategoryEdit('${id||''}')">저장</button>`);const sel=document.getElementById('categoryParent');if(sel)sel.value=par}
function saveCategoryEdit(id){const name=document.getElementById('categoryName')?.value.trim(),parent=document.getElementById('categoryParent')?.value||'';if(!name)return toast('이름을 입력하세요.');tx('Category 저장',()=>{const p=page(),now=Date.now(),x=id?p.categories[id]:{id:alloc(p,'category'),createdAt:now};x.name=name;if(parent)x.parentId=parent;else delete x.parentId;x.updatedAt=now;p.categories[x.id]=x});closeModal()}
function quickChildCategory(parentId){const p=page(),par=p.categories[parentId];if(!par)return;categoryEditModal(null,parentId)}
function detachCategoryRefs(ids){const p=page(),set=ids instanceof Set?ids:new Set(ids);for(const e of [...Object.values(p.bookmarks),...Object.values(p.records)])for(const [iid,v] of Object.entries(e.values||{})){const inp=p.inputs[iid];if(inp?.type!=='relation'||inp.target!=='category')continue;if(Array.isArray(v)){e.values[iid]=v.filter(x=>!set.has(x));if(!e.values[iid].length)delete e.values[iid]}else if(set.has(v))delete e.values[iid]}}
function deleteCategories(ids,withDesc=false){const p=page(),base=new Set(ids.filter(id=>p.categories[id])),del=new Set(base);if(withDesc)for(const id of [...base])for(const d of categoryDescendants(id))del.add(d);const original=Object.fromEntries(Object.entries(p.categories).map(([id,c])=>[id,{...c}]));for(const c of Object.values(p.categories)){if(del.has(c.id))continue;if(c.parentId&&del.has(c.parentId)){let par=original[c.parentId]?.parentId||null;while(par&&del.has(par))par=original[par]?.parentId||null;if(par)c.parentId=par;else delete c.parentId}}detachCategoryRefs(del);for(const id of del)delete p.categories[id];for(const id of del)rt.selected.delete(id)}
function categoryDeleteModal(id){const p=page(),c=p.categories[id];if(!c)return;const usage=categoryUsageMap(),desc=categoryDescendants(id),childCount=desc.size-1;modal('Category 삭제',`<div class="notice"><b>${E(c.name)}</b> · 직접 사용 ${usage[id]||0}개 · 하위 ${childCount}개</div><div class="category-delete-options"><button onclick="confirmCategoryDelete('${id}',false)"><b>이 Category만 삭제</b><br><span class="muted">하위 Category는 한 단계 위로 승격하고 참조만 제거합니다.</span></button><button class="danger" onclick="confirmCategoryDelete('${id}',true)"><b>하위 Category까지 삭제</b><br><span class="muted">전체 하위 트리와 관련 참조를 함께 제거합니다.</span></button></div>`,`<button onclick="closeModal()">취소</button>`)}
function confirmCategoryDelete(id,withDesc){tx(withDesc?'Category 하위 트리 삭제':'Category 삭제',()=>deleteCategories([id],withDesc));closeModal()}
function bulkCategoryParentModal(){const roots=selectedCategoryRoots();if(!roots.length)return toast('Category를 선택하세요.');modal('선택 Category 부모 변경',`<div class="form"><div class="notice">상위/하위가 함께 선택된 경우 최상위 선택 Category만 이동하여 내부 계층은 유지합니다. 이동 대상 ${roots.length}개.</div><label>새 부모<select id="bulkCategoryParent">${categoryParentOptions(roots)}</select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="applyBulkCategoryParent()">이동</button>`)}
function applyBulkCategoryParent(){const roots=selectedCategoryRoots(),par=document.getElementById('bulkCategoryParent')?.value||'';tx('Category 부모 일괄 변경',()=>{const p=page();for(const id of roots){const c=p.categories[id];if(!c)continue;if(par)c.parentId=par;else delete c.parentId;c.updatedAt=Date.now()}});closeModal()}
function bulkCategoryDeleteModal(){const ids=[...rt.selected].filter(id=>page().categories[id]);if(!ids.length)return toast('Category를 선택하세요.');modal('선택 Category 삭제',`<div class="notice">선택 ${ids.length}개. 상위/하위가 함께 선택되어도 안전하게 정리합니다.</div><div class="category-delete-options"><button onclick="confirmBulkCategoryDelete(false)"><b>선택한 Category만 삭제</b><br><span class="muted">선택되지 않은 하위 Category는 가장 가까운 남은 상위로 승격합니다.</span></button><button class="danger" onclick="confirmBulkCategoryDelete(true)"><b>선택 Category의 하위까지 삭제</b><br><span class="muted">선택된 각 Category의 전체 하위 트리도 제거합니다.</span></button></div>`,`<button onclick="closeModal()">취소</button>`)}
function confirmBulkCategoryDelete(withDesc){const ids=[...rt.selected];tx(withDesc?'Category Bulk 하위 삭제':'Category Bulk 삭제',()=>deleteCategories(ids,withDesc));rt.selected.clear();closeModal()}
function categoryTabView(t){const p=page();ensureCategoryTabConfig(t);const {items,usage}=categoryItems(t),total=Object.keys(p.categories||{}).length,used=Object.values(usage).filter(n=>n>0).length,roots=Object.values(p.categories).filter(c=>!c.parentId||!p.categories[c.parentId]).length,so=t.categorySort||{by:'name',direction:'asc'};return `<div class="category-shell"><div class="category-toolbar"><input id="categorySearch" type="search" placeholder="Category / 경로 검색" value="${E(rt.search)}" oninput="liveTabSearch(this.value,'categorySearch')"><select onchange="setCategoryUsageFilter(this.value)"><option value="all" ${t.categoryUsageFilter==='all'?'selected':''}>전체</option><option value="used" ${t.categoryUsageFilter==='used'?'selected':''}>사용 중</option><option value="unused" ${t.categoryUsageFilter==='unused'?'selected':''}>미사용</option></select><select onchange="setCategorySort(this.value)"><option value="name" ${so.by==='name'?'selected':''}>이름순</option><option value="usage" ${so.by==='usage'?'selected':''}>사용량순</option></select><button onclick="toggleCategorySortDir()">${so.direction==='desc'?'↓ Z→A':'↑ A→Z'}</button></div><div class="category-stats">전체 ${total}개 · 표시 ${items.length}개 · 사용 중 ${used}개 · 최상위 ${roots}개</div><div class="category-actions"><button class="primary" onclick="categoryEditModal(null)" title="Category 추가" aria-label="Category 추가">＋</button><button onclick="toggleSelect()">${rt.select?'선택 종료':'선택'}</button><span class="spacer"></span><details class="moremenu"><summary>더보기</summary><div class="moremenu-pop"><button onclick="setAllCategoryNodes(false)">모두 펼치기</button><button onclick="setAllCategoryNodes(true)">모두 접기</button><button onclick="setCategoryViewMode('${t.categoryViewMode==='list'?'tree':'list'}')">${t.categoryViewMode==='list'?'Tree 보기':'경로 목록'}</button><button onclick="tabSettings()">탭 설정</button></div></details></div>${rt.select||rt.selected.size?categoryBulkBar():''}${t.categoryViewMode==='list'?categoryListHtml(t,items,usage):categoryTreeHtml(t,items,usage)}</div>`}

function recordListView(t,a){const p=page();if(!a.length)return '<div class="empty">표시할 Record가 없습니다.</div>';if(t.grouping?.mode==='input'&&t.grouping.inputId&&p.inputs[t.grouping.inputId]){const inp=p.inputs[t.grouping.inputId],groups=new Map();for(const e of a){const raw=e.values?.[inp.id],vals=Array.isArray(raw)&&raw.length?raw:[raw===undefined||raw===''?'__empty__':raw];for(const k of vals){const sk=String(k);if(!groups.has(sk))groups.set(sk,[]);groups.get(sk).push(e)}}return [...groups.entries()].sort((A,B)=>String(A[0]).localeCompare(String(B[0]),undefined,{numeric:true})).map(([k,rows])=>{const closed=rt.collapsedRecordGroups.has(recordGroupKey('list:'+k)),label=k==='__empty__'?'값 없음':displayValue(inp,k);return `<details class="record-profile-folder" ${closed?'':'open'}><summary onclick="event.preventDefault();toggleRecordGroup('list:${E(k)}')"><span>${E(label)}</span><span class="muted">${rows.length}개</span></summary><div class="record-list">${rows.map(e=>recordListRow(t,e)).join('')}</div></details>`}).join('')}return `<div class="record-list">${a.map(e=>recordListRow(t,e)).join('')}</div>`}

function editEntity(id){const t=curt(),p=page(),col=t.type==='bookmark'?p.bookmarks:p.records,e=id?col[id]:{id:null,values:{}},s=p.schemas[t.schemaId];let html='<div class="form">',seen=new Set(),metaDone=false,meta=t.type==='bookmark'?(t.convenience?.meta||{}):{},ids=tabInputIds(p,t),pageI=meta.pageInputId&&ids.includes(meta.pageInputId)&&p.inputs[meta.pageInputId]?.type==='number'?meta.pageInputId:null,durI=meta.durationInputId&&ids.includes(meta.durationInputId)&&p.inputs[meta.durationInputId]?.type==='duration'?meta.durationInputId:null;for(const gid of s.fieldOrder){const f=s.fields[gid];for(const qid of f.placementOrder){const pl=f.placements[qid],inp=p.inputs[pl.inputId];if(!inp||pl.presetGenerated||seen.has(inp.id))continue;if(t.type==='bookmark'&&pageI&&durI&&(inp.id===pageI||inp.id===durI)){if(!metaDone){seen.add(pageI);seen.add(durI);html+=legacyMetaEditor(p.inputs[pageI],p.inputs[durI],e);metaDone=true}continue}seen.add(inp.id);html+=editor(inp,e.values?.[inp.id],pl)}}const ua=id?unassignedValues(t,e):[];if(ua.length)html+=`<details class="unassigned" open><summary>미지정 정보 (${ua.length})</summary>${ua.filter(([iid])=>!seen.has(iid)).map(([iid,v])=>editor(p.inputs[iid],v)).join('')}</details>`;if(t.type==='bookmark'){html+=`<label>폴더<select id="folderId"><option value="">폴더 없음</option>${Object.values(p.folders).map(f=>`<option value="${f.id}" ${e.folderId===f.id?'selected':''}>${E(f.name)}</option>`).join('')}</select></label>`;const cfg=recordQuickConfig(t),relId=bookmarkRecordRelationId(t);if(relId&&cfg.nameInputId)html+=`<div class="row"><button type="button" onclick="characterWizard('${id||''}')">＋ Character / Cast</button><button type="button" onclick="copyRecordLinks('${relId}')">등장인물/Record 복사</button></div>`}html+='</div>';modal(id?'편집':'새 '+(t.type==='bookmark'?'Bookmark':'Record'),html,`<button onclick="closeModal()">취소</button>${id?`<button onclick="cloneEntity('${id}')">복제</button><button class="danger" onclick="confirmDeleteEntity('${id}')">삭제 function relationMap(target){const p=page();return {tag:p.tags,record:p.records,bookmark:p.bookmarks,category:p.categories,folder:p.folders}[target]||{}}

function relationLabel(target,x){if(!x)return'';if(target==='category')return categoryPathName(x.id)||x.name||x.id;if(target==='tag'){const h=x.headId?page().tagHeads[x.headId]:null;return (h?`${h.name} · `:'')+(x.name||x.id)}return entityNameById(target,x.id)}

function relationPickerHtml(inp,v){const m=relationMap(inp.target),vals=Array.isArray(v)?v:(v?[v]:[]),opts=Object.values(m).sort((a,b)=>relationLabel(inp.target,a).localeCompare(relationLabel(inp.target,b),undefined,{numeric:true}));const selected=opts.filter(x=>vals.includes(x.id));const quick=['tag','category','record'].includes(inp.target)?`<button type="button" onclick="inlineCreateRelation('${inp.id}')" title="${inp.target==='tag'?'Tag':inp.target==='category'?'Category':'Record'} 추가" aria-label="${inp.target==='tag'?'Tag':inp.target==='category'?'Category':'Record'} 추가">＋</button>`:'';return `<label>${E(inp.name)}</label><div class="relbox" data-relbox="${inp.id}" data-target="${inp.target}"><div class="relselected" data-relchips>${selected.map(x=>`<button type="button" class="chip ${inp.target==='tag'?'tag-pill':''}" ${inp.target==='tag'?`style="${E(tagPillVars(x))}"`:''} onclick="event.stopPropagation();removeRelationOption('${inp.id}','${x.id}')">${E(relationLabel(inp.target,x))} ×</button>`).join('')||'<span class="muted">선택 없음</span>'}</div>${quickTagHeadButtons(inp,vals)}<div class="relsearchrow"><input type="search" data-rel-search="${inp.id}" placeholder="${E(inp.name)} 검색" oninput="relationSearch('${inp.id}')">${quick}</div><div class="relresults" data-relresults>${opts.slice(0,18).filter(x=>!vals.includes(x.id)||!inp.multiple).map(x=>`<button type="button" onclick="event.stopPropagation();toggleRelationOption('${inp.id}','${x.id}')">${vals.includes(x.id)?'✓ ':''}${E(relationLabel(inp.target,x))}</button>`).join('')}</div><select class="relhidden" data-i="${inp.id}" ${inp.multiple?'multiple':''}>${opts.map(x=>`<option value="${x.id}" ${vals.includes(x.id)?'selected':''}>${E(relationLabel(inp.target,x))}</option>`).join('')}</select></div>`}
function relationSearch(iid){const inp=page().inputs[iid],box=document.querySelector(`[data-relbox="${iid}"]`);if(!inp||!box)return;const q=(box.querySelector(`[data-rel-search="${iid}"]`)?.value||'').trim().toLowerCase(),sel=box.querySelector(`select[data-i="${iid}"]`),chosen=new Set([...sel.selectedOptions].map(o=>o.value)),items=Object.values(relationMap(inp.target)).filter(x=>!q||relationLabel(inp.target,x).toLowerCase().includes(q)).sort((a,b)=>relationLabel(inp.target,a).localeCompare(relationLabel(inp.target,b),undefined,{numeric:true})).slice(0,30);box.querySelector('[data-relresults]').innerHTML=items.map(x=>`<button type="button" onclick="event.stopPropagation();toggleRelationOption('${iid}','${x.id}')">${chosen.has(x.id)?'✓ ':''}${E(relationLabel(inp.target,x))}</button>`).join('')||'<span class="muted">검색 결과 없음</span>'}

function inlineCreateRelation(iid){const inp=page().inputs[iid];if(!inp)return;if(inp.target==='tag'){const p=page(),heads=p.tagHeadOrder.filter(id=>p.tagHeads[id]);subModal('새 Tag',`<div class="form"><label>이름<input id="inlineRelName"></label>${heads.length?`<label>태그 그룹<select id="inlineRelParent">${heads.map(id=>`<option value="${id}">${E(p.tagHeads[id].name)}</option>`).join('')}</select></label>`:'<div class="notice">태그 그룹이 없어 기본 태그 그룹을 함께 생성합니다.</div>'}</div>`,`<button onclick="closeSubModal()">취소</button><button class="primary" onclick="confirmInlineRelationCreate('${iid}','tag')">생성 + 선택</button>`)}else if(inp.target==='category'){const p=page();subModal('새 Category',`<div class="form"><label>이름<input id="inlineRelName"></label><label>상위 Category<select id="inlineRelParent"><option value="">없음</option>${Object.values(p.categories).sort((a,b)=>categoryPathName(a.id).localeCompare(categoryPathName(b.id))).map(c=>`<option value="${c.id}">${E(categoryPathName(c.id))}</option>`).join('')}</select></label></div>`,`<button onclick="closeSubModal()">취소</button><button class="primary" onclick="confirmInlineRelationCreate('${iid}','category')">생성 + 선택</button>`)}else if(inp.target==='record'){subModal('새 Record',`<div class="form"><label>이름<input id="inlineRelName"></label><div class="notice">이름만 빠르게 만든 뒤 Record Tab에서 세부 정보를 추가할 수 있습니다.</div></div>`,`<button onclick="closeSubModal()">취소</button><button class="primary" onclick="confirmInlineRelationCreate('${iid}','record')">생성 + 선택</button>`)}}
function confirmInlineRelationCreate(iid,target){const name=document.getElementById('inlineRelName')?.value.trim();if(!name)return toast('이름을 입력하세요.');const recordNameI=target==='record'?recordPrimaryInputId(page()):null;if(target==='record'&&!recordNameI)return toast('Record 탭에 이름으로 사용할 Text 정보를 만들고 탭 설정에서 연결하세요.');let nid;tx('Relation 항목 빠른 생성',()=>{const p=page();if(target==='tag'){let hid=document.getElementById('inlineRelParent')?.value;if(!hid){hid=alloc(p,'tagHead');p.tagHeads[hid]={id:hid,name:'기본',color:'#64748b'};p.tagHeadOrder.push(hid)}nid=alloc(p,'tag');p.tags[nid]={id:nid,name,headId:hid,createdAt:Date.now(),updatedAt:Date.now()}}else if(target==='category'){nid=alloc(p,'category');p.categories[nid]={id:nid,name};const par=document.getElementById('inlineRelParent')?.value;if(par)p.categories[nid].parentId=par}else{nid=alloc(p,'record');p.records[nid]={id:nid,values:{[recordNameI]:name},createdAt:Date.now(),updatedAt:Date.now()}}});closeSubModal();const inp=page().inputs[iid],sel=document.querySelector(`[data-relbox="${iid}"] select[data-i="${iid}"]`),x=relationMap(target)[nid];if(sel&&x){if(!inp.multiple)for(const o of sel.options)o.selected=false;const o=new Option(relationLabel(target,x),nid,true,true);sel.add(o);refreshRelationPicker(iid)}toast(`${name} 생성 후 선택했습니다.`)}
function bookmarkUrl(e,t=curt()){const p=page(),s=p.schemas[t?.schemaId];if(s)for(const gid of s.fieldOrder||[]){const f=s.fields?.[gid];for(const qid of f?.placementOrder||[]){const pl=f.placements?.[qid],iid=pl?.card?.format==='title'?pl.card?.linkInputId:null;if(iid&&p.inputs[iid]?.type==='url'&&e.values?.[iid])return String(e.values[iid])}}for(const iid of schemaInputs(t)){const inp=p.inputs[iid];if(inp?.type==='url'&&e.values?.[iid])return String(e.values[iid])}return''}
function openBookmarkUrl(id){const b=page().bookmarks[id],url=b?bookmarkUrl(b):'';if(!url)return toast('URL이 없습니다.');window.open(url,'_blank','noopener,noreferrer')}
function quickPick(id){rt.select=true;if(rt.selected.has(id))rt.selected.delete(id);else rt.selected.add(id);renderBody()}
function repairDB(d){
 let fixed=0;if(!d||typeof d!=='object')return fixed;d.pages=d.pages&&typeof d.pages==='object'?d.pages:{};d.main=d.main&&typeof d.main==='object'?d.main:{pageOrder:[]};d.ids=d.ids||{};
 const floor=(scope,k,ids)=>{let mx=0;for(const id of ids||[]){if(typeof id!=='string'||!id.startsWith(pref[k]))continue;const n=parseInt(id.slice(1),36);if(Number.isFinite(n))mx=Math.max(mx,n)}if((Number(scope.ids?.[k])||1)<=mx){scope.ids=scope.ids||{};scope.ids[k]=mx+1;fixed++}};
 floor(d,'page',Object.keys(d.pages));
 const po=[...new Set((Array.isArray(d.main.pageOrder)?d.main.pageOrder:[]).filter(id=>d.pages[id]))];for(const id of Object.keys(d.pages))if(!po.includes(id))po.push(id);if(JSON.stringify(po)!==JSON.stringify(d.main.pageOrder||[])){d.main.pageOrder=po;fixed++}
 for(const [pid,p] of Object.entries(d.pages)){
  if(!p||typeof p!=='object')continue;if(p.id!==pid){p.id=pid;fixed++}p.tabs=p.tabs||{};p.schemas=p.schemas||{};p.inputs=p.inputs||{};p.bookmarks=p.bookmarks||{};p.records=p.records||{};p.tags=p.tags||{};p.tagHeads=p.tagHeads||{};p.categories=p.categories||{};p.folders=p.folders||{};p.ids=p.ids||{};if(!['individual','head'].includes(p.tagColorDisplayMode)){p.tagColorDisplayMode='individual';fixed++};
  floor(p,'tab',Object.keys(p.tabs));floor(p,'schema',Object.keys(p.schemas));floor(p,'input',Object.keys(p.inputs));floor(p,'bookmark',Object.keys(p.bookmarks));floor(p,'record',Object.keys(p.records));floor(p,'tag',Object.keys(p.tags));floor(p,'tagHead',Object.keys(p.tagHeads));floor(p,'category',Object.keys(p.categories));floor(p,'folder',Object.keys(p.folders));const fieldIds=[],placementIds=[];for(const s of Object.values(p.schemas)){for(const [gid,f] of Object.entries(s?.fields||{})){fieldIds.push(gid);placementIds.push(...Object.keys(f?.placements||{}))}}floor(p,'field',fieldIds);floor(p,'placement',placementIds);
  const normalizeOrder=(key,map)=>{const old=Array.isArray(p[key])?p[key]:[],a=[...new Set(old.filter(id=>map[id]))];for(const id of Object.keys(map))if(!a.includes(id))a.push(id);if(JSON.stringify(a)!==JSON.stringify(old)){p[key]=a;fixed++}};normalizeOrder('tabOrder',p.tabs);normalizeOrder('tagHeadOrder',p.tagHeads);
  for(const [tid,t] of Object.entries(p.tabs)){if(t?.id!==tid){t.id=tid;fixed++}if(['bookmark','record'].includes(t?.type)&&(!t.schemaId||!p.schemas[t.schemaId])){t.schemaId=schema(p,t.type,[]);fixed++}}
  for(const [sid,s] of Object.entries(p.schemas)){if(s.id!==sid){s.id=sid;fixed++}s.fields=s.fields||{};const fo=[...new Set((Array.isArray(s.fieldOrder)?s.fieldOrder:[]).filter(id=>s.fields[id]))];for(const id of Object.keys(s.fields))if(!fo.includes(id))fo.push(id);if(JSON.stringify(fo)!==JSON.stringify(s.fieldOrder||[])){s.fieldOrder=fo;fixed++}for(const [gid,f] of Object.entries(s.fields)){if(f.id!==gid){f.id=gid;fixed++}f.placements=f.placements||{};for(const [qid,q] of Object.entries({...f.placements}))if(!q||!p.inputs[q.inputId]){delete f.placements[qid];fixed++}const qo=[...new Set((Array.isArray(f.placementOrder)?f.placementOrder:[]).filter(id=>f.placements[id]))];for(const id of Object.keys(f.placements))if(!qo.includes(id))qo.push(id);if(JSON.stringify(qo)!==JSON.stringify(f.placementOrder||[])){f.placementOrder=qo;fixed++}}}
  for(const b of Object.values(p.bookmarks))if(b.folderId&&!p.folders[b.folderId]){delete b.folderId;fixed++}
  for(const [cid,c] of Object.entries(p.categories)){if(c.id!==cid){c.id=cid;fixed++}if(c.parentId&&!p.categories[c.parentId]){delete c.parentId;fixed++;continue}let seen=new Set([cid]),cur=c.parentId;while(cur){if(seen.has(cur)){delete c.parentId;fixed++;break}seen.add(cur);cur=p.categories[cur]?.parentId}}
  if(ensureConvenienceConfig(p))fixed++;if(ensureBookmarkPresentation(p))fixed++;if(ensureTagTabConfig(p))fixed++;if(ensureRecordTabConfig(p))fixed++;for(const t of Object.values(p.tabs))if(ensureCategoryTabConfig(t))fixed++
 }
 return fixed
}
function dbDiagnostics(d=db){let dangling=0,unknownValues=0;for(const p of Object.values(d?.pages||{})){for(const e of [...Object.values(p.bookmarks||{}),...Object.values(p.records||{})])for(const [iid,v] of Object.entries(e.values||{})){const inp=p.inputs?.[iid];if(!inp){unknownValues++;continue}if(inp.type==='relation'){const map={tag:p.tags,record:p.records,bookmark:p.bookmarks,category:p.categories,folder:p.folders}[inp.target];if(map){for(const id of (Array.isArray(v)?v:[v]))if(id&&!map[id])dangling++}}}}return {dangling,unknownValues}}
function dbCheck(){const before=validate(db),candidate=C(db);let fixed=0;try{fixed=repairDB(candidate)}catch(e){return modal('DB Check',`<div class="notice dbwarn">자동 수리 중 오류: ${E(e.message)}</div>`)}const after=validate(candidate),diag=dbDiagnostics(candidate);if(!after.length&&fixed){tx('DB 자동 수리',()=>{db=candidate})}modal('DB Check',`<div class="notice ${after.length?'dbwarn':'dbok'}">검사 완료 · 수리 가능 ${fixed}건 · 남은 구조 오류 ${after.length}건</div>${after.length?`<div class="notice" style="margin-top:8px">${after.map(E).join('<br>')}</div>`:''}<div class="notice" style="margin-top:8px">참고 진단 · 연결 대상이 없는 Relation ${diag.dangling}개 · 정의가 없는 보존 값 ${diag.unknownValues}개</div>`)}
function virtualSlice(a){const LIMIT=300;if(a.length<=LIMIT)return a;return a.slice(0,LIMIT)}
const _renderEntities403=renderEntities;renderEntities=function(t,a){const cut=virtualSlice(a),html=_renderEntities403(t,cut);return a.length>cut.length?html+`<div class="notice" style="margin-top:10px">성능 보호를 위해 현재 ${cut.length}/${a.length}개를 표시합니다. 검색/필터로 범위를 좁히면 해당 결과가 표시됩니다.</div>`:html}

// v4.05 additional legacy convenience features.
function bulkRelationQuick(target){const t=curt(),p=page();if(!rt.selected.size)return toast('항목을 먼저 선택하세요.');const inp=schemaInputs(t).map(id=>p.inputs[id]).find(i=>i?.type==='relation'&&i.target===target&&i.multiple);if(!inp)return toast(`현재 구성에 ${target} 연결 정보가 없습니다.`);const m=target==='tag'?p.tags:p.categories,opts=Object.values(m).sort((a,b)=>String(a.name).localeCompare(String(b.name))).map(x=>`<option value="${x.id}">${E(x.name)}</option>`).join('');modal(target==='tag'?'태그 추가':'카테고리 추가',`<div class="form"><div class="notice">선택 ${rt.selected.size}개에 기존 항목을 추가합니다.</div><label>${target==='tag'?'Tag':'Category'}<select id="quickRel" multiple size="8">${opts}</select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="applyBulkRelationQuick('${inp.id}')" title="추가" aria-label="추가">＋</button>`)}
function applyBulkRelationQuick(iid){const vals=[...document.getElementById('quickRel').selectedOptions].map(o=>o.value);if(!vals.length)return toast('추가할 항목을 선택하세요.');tx('Relation 일괄 추가',()=>{const p=page(),t=curt(),col=t.type==='bookmark'?p.bookmarks:p.records;for(const id of rt.selected){const e=col[id];if(!e)continue;const cur=Array.isArray(e.values?.[iid])?e.values[iid]:[];e.values[iid]=[...new Set([...cur,...vals])];e.updatedAt=Date.now()}});closeModal()}
function detachTagRefs(ids){const p=page(),set=new Set(ids);for(const e of [...Object.values(p.bookmarks),...Object.values(p.records)])for(const [iid,v] of Object.entries(e.values||{})){const inp=p.inputs[iid];if(inp?.type!=='relation'||inp.target!=='tag')continue;if(Array.isArray(v)){e.values[iid]=v.filter(x=>!set.has(x));if(!e.values[iid].length)delete e.values[iid]}else if(set.has(v))delete e.values[iid]}}
function deleteHeadFlow(id){const p=page(),h=p.tagHeads[id];if(!h)return;const tags=Object.values(p.tags).filter(t=>t.headId===id),others=p.tagHeadOrder.filter(x=>x!==id&&p.tagHeads[x]);closeModal();modal('태그 그룹 삭제',`<div class="form"><div class="notice">${E(h.name)} · Tag ${tags.length}개</div>${tags.length&&others.length?`<label>Tag 이동 대상<select id="headMoveTo">${others.map(x=>`<option value="${x}">${E(p.tagHeads[x].name)}</option>`).join('')}</select></label><button onclick="deleteHeadMove('${id}')">Tag 이동 후 Head 삭제</button>`:''}<button class="danger" onclick="deleteHeadAndTags('${id}')">Head와 소속 Tag 함께 삭제</button></div>`,`<button onclick="closeModal()">취소</button>`)}
function deleteHeadMove(id){const to=document.getElementById('headMoveTo')?.value;if(!to)return toast('이동할 Head가 없습니다.');tx('태그 그룹 삭제/이동',()=>{const p=page();for(const x of Object.values(p.tags))if(x.headId===id)x.headId=to;for(const tab of Object.values(p.tabs||{}))if(tab.type==='tag'){if(Array.isArray(tab.tagCreateHeadIds))tab.tagCreateHeadIds=[...new Set(tab.tagCreateHeadIds.map(x=>x===id?to:x))];if(Array.isArray(tab.visibleTagHeadIds))tab.visibleTagHeadIds=[...new Set(tab.visibleTagHeadIds.map(x=>x===id?to:x))]}delete p.tagHeads[id];p.tagHeadOrder=p.tagHeadOrder.filter(x=>x!==id)});closeModal()}
function deleteHeadAndTags(id){tx('태그 그룹 + Tag 삭제',()=>{const p=page(),ids=Object.values(p.tags).filter(t=>t.headId===id).map(t=>t.id);detachTagRefs(ids);for(const tid of ids)delete p.tags[tid];for(const tab of Object.values(p.tabs||{}))if(tab.type==='tag'){if(Array.isArray(tab.tagCreateHeadIds))tab.tagCreateHeadIds=tab.tagCreateHeadIds.filter(x=>x!==id);if(Array.isArray(tab.visibleTagHeadIds))tab.visibleTagHeadIds=tab.visibleTagHeadIds.filter(x=>x!==id)}delete p.tagHeads[id];p.tagHeadOrder=p.tagHeadOrder.filter(x=>x!==id)});closeModal()}
function createDemoPage(){closeModal();let pid;tx('테스트 Page 생성',()=>{pid=makeTestPage(db,VERSION);db.meta.testSeedInitialized=true});if(pid){rt.pageId=pid;rt.tabId=db.pages[pid].tabOrder[0]||null;rt.selected.clear();rt.search='';render();toast('샘플 Bookmark/Tag/Category/Record가 포함된 테스트 Page를 생성했습니다.')}}
// v4.04 legacy convenience functions, implemented on the v4 data model.
function clearSelection(){rt.selected.clear();renderBody()}
function cloneEntity(id){const t=curt(),p=page();if(!['bookmark','record'].includes(t?.type))return;const col=t.type==='bookmark'?p.bookmarks:p.records,src=col[id];if(!src)return;tx('Entity 복제',()=>{const n=C(src),nid=alloc(p,t.type);n.id=nid;n.createdAt=Date.now();n.updatedAt=n.createdAt;col[nid]=n});closeModal();toast('복제했습니다.')}
function copyRecordLinks(inputId){const el=document.querySelector(`[data-i="${inputId}"]`);if(!el)return toast('등장인물 입력을 찾을 수 없습니다.');const ids=[...el.selectedOptions].map(o=>o.value).filter(Boolean);if(!ids.length)return toast('복사할 등장인물을 선택하세요.');rt.recordClipboard=[...new Set(ids)];toast(`${rt.recordClipboard.length}명의 등장인물을 복사했습니다.`)}
function pasteRecordClipboard(){const t=curt(),p=page();if(t?.type!=='bookmark')return;if(!rt.selected.size)return toast('붙여넣을 Bookmark를 선택하세요.');if(!rt.recordClipboard.length)return toast('먼저 Bookmark 편집에서 등장인물/Record를 복사하세요.');const relId=bookmarkRecordRelationId(t),rel=relId?p.inputs[relId]:null;if(!rel)return toast('기존 Bookmark → Record 빠른 연결 설정이 없습니다.');tx('등장인물/Record 붙여넣기',()=>{for(const id of rt.selected){const b=p.bookmarks[id];if(!b)continue;const old=Array.isArray(b.values?.[rel.id])?b.values[rel.id]:(b.values?.[rel.id]?[b.values[rel.id]]:[]);b.values[rel.id]=[...new Set([...old,...rt.recordClipboard])];b.updatedAt=Date.now()}});rt.selected.clear();toast('선택한 Bookmark에 Record 관계를 붙여넣었습니다.')}
function duplicateTabNow(id){const p=page(),src=p.tabs[id];if(!src)return;const inPageSettings=!!document.querySelector('#modal [data-order-list="tab"]'),draft=inPageSettings?pageSettingsDraft():null;tx('Tab 복제',()=>{let sid=null;if(src.schemaId&&p.schemas[src.schemaId])sid=cloneSchema(p,p.schemas[src.schemaId]);const nid=alloc(p,'tab'),n=C(src);n.id=nid;n.name=src.name+' Copy';if(sid)n.schemaId=sid;p.tabs[nid]=n;const at=p.tabOrder.indexOf(id);p.tabOrder.splice(at+1,0,nid)});if(inPageSettings)setTimeout(()=>refreshPageSettingsModal(draft),0);else closeModal();toast('Tab을 복제했습니다.')}

function activeSearchId(){if(!rt.pageId)return'mainSearch';const t=curt();return t?.type==='bookmark'?'bookmarkSearch':t?.type==='tag'?'tagSearch':t?.type==='category'?'categorySearch':t?.type==='record'?'recordSearch':null}
function globalKeys(e){const tag=e.target?.tagName?.toLowerCase(),typing=['input','textarea','select'].includes(tag)||e.target?.isContentEditable;if(e.key==='Escape'){if(document.getElementById('submodal')){e.preventDefault();closeSubModal();return}if(document.getElementById('modal')){e.preventDefault();closeModal();return}if(rt.sideOpen){e.preventDefault();toggleSidebar(false);return}}if(!typing&&(e.ctrlKey||e.metaKey)&&!e.altKey){const k=e.key.toLowerCase();if(k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}if(k==='y'){e.preventDefault();redo();return}}if(!typing&&e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!document.getElementById('modal')){const id=activeSearchId(),el=id&&document.getElementById(id);if(el){e.preventDefault();el.focus()}}}
document.addEventListener('keydown',globalKeys);
window.addEventListener('error',e=>{rt.lastError=e.message||'Runtime error';rt.save=rt.save==='saving'?'failed':rt.save;renderStatus()});
window.addEventListener('unhandledrejection',e=>{rt.lastError=String(e.reason?.message||e.reason||'Unhandled rejection');rt.save=rt.save==='saving'?'failed':rt.save;renderStatus()});
load().catch(e=>{rt.lastError=e.message;document.getElementById('app').innerHTML='<div class="empty">시작 실패: '+E(e.message)+'</div>'});
</script></body></html>
